title: ChipCraft Academy
tagline: "Master Digital IC Design — From RTL to Silicon"
description: >-
  Free tutorials, guides, and curated courses on Digital IC Design,
  RTL, ASIC, VLSI, STA, and Verification for beginners and professionals.
url: "https://ankur-gupta-29.github.io"
baseurl: "/chipcraft-academy"

author:
  name: ChipCraft Academy
  email: ankurgupta.iitb@outlook.com

# Theme
theme: minima

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Collections
collections:
  courses:
    output: true
    permalink: /courses/:name/

# Navigation
header_pages:
  - about.md
  - blog.md
  - courses.md
  - shop.md
  - resources.md

# AdSense — replace with your publisher ID
adsense_client: "ca-pub-2416419296440776"
adsense_slot: "6704270065"

# Google Analytics GA4 — replace G-XXXXXXXXXX with your real Measurement ID
# Get it from: https://analytics.google.com → Admin → Data Streams → your stream
google_analytics: "G-329CRWSF74"

# Google Search Console — replace with your verification token
# Get it from: https://search.google.com/search-console → Add property → HTML tag method
# Copy ONLY the content="..." value (not the whole tag)
google_search_console: ""

# Gumroad store URL
gumroad_url: "https://ankurgupta6.gumroad.com"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
  - vendor/
  - vendor/bundle/
  - scripts/
  - scripts/verify_riscv/
  - .github/
