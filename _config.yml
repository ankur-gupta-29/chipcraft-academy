title: ChipCraft Academy
tagline: "Master Digital IC Design — From RTL to Silicon"
description: >-
  Free tutorials, guides, and curated courses on Digital IC Design,
  RTL, ASIC, VLSI, STA, and Verification for beginners and professionals.
url: "https://ankur-gupta-29.github.io"
baseurl: "/chipcraft-academy"

author:
  name: ChipCraft Academy
  email: your@email.com

# Theme
theme: minima

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Collections
collections:
  courses:
    output: true
    permalink: /courses/:name/

# Navigation
header_pages:
  - about.md
  - blog.md
  - courses.md
  - shop.md
  - resources.md

# AdSense — replace with your publisher ID
adsense_client: "ca-pub-XXXXXXXXXXXXXXXX"
adsense_slot: "XXXXXXXXXX"

# Google Analytics — replace with your GA4 measurement ID
google_analytics: "G-XXXXXXXXXX"

# Gumroad store URL
gumroad_url: "https://yourname.gumroad.com"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
