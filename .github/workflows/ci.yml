name: CI — Validate & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Jekyll build ───────────────────────────────────────
  build-jekyll:
    name: Jekyll Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Verify _site was generated
        run: |
          if [ ! -d "_site" ]; then
            echo "❌ _site directory missing — Jekyll build failed silently"
            exit 1
          fi
          HTML_COUNT=$(find _site -name "*.html" | wc -l)
          echo "✅ _site generated with ${HTML_COUNT} HTML files"
          if [ "$HTML_COUNT" -lt 3 ]; then
            echo "❌ Too few HTML files — something went wrong"
            exit 1
          fi

  # ── Job 2: Verilog syntax check ──────────────────────────────
  check-verilog:
    name: Verilog Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          echo "iverilog version: $(iverilog -V 2>&1 | head -1)"

      - name: Run Verilog checker
        run: python3 scripts/check_verilog.py

  # ── Job 3: Front matter validation ───────────────────────────
  check-posts:
    name: Post Front Matter Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate post front matter
        run: python3 scripts/check_posts.py

  # ── Job 4: cocotb testbenches ────────────────────────────────
  cocotb-tests:
    name: cocotb Testbenches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          echo "iverilog version: $(iverilog -V 2>&1 | head -1)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cocotb
        run: pip install cocotb

      - name: Run ALU testbench
        working-directory: scripts/verify_riscv
        run: |
          make -f Makefile.alu
          echo "✅ ALU testbench passed"

      - name: Run ImmGen testbench
        working-directory: scripts/verify_riscv
        run: |
          make -f Makefile.imm_gen
          echo "✅ ImmGen testbench passed"

      - name: Run RISC-V single-cycle testbench
        working-directory: scripts/verify_riscv
        run: |
          make -f Makefile.riscv
          echo "✅ RISC-V single-cycle testbench passed"

      - name: Upload cocotb results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocotb-results
          path: scripts/verify_riscv/results_*.xml
