<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" style="background:#0d1117;font-family:ui-monospace,monospace;">
  <rect width="700" height="420" fill="#0d1117"/>
  <text x="350" y="28" fill="#e6edf3" font-size="15" font-weight="bold" text-anchor="middle">VLSI Floorplan — Typical SoC Layout</text>

  <!-- Die boundary -->
  <rect x="40" y="48" width="620" height="350" rx="4" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="350" y="44" fill="#58a6ff" font-size="10" text-anchor="middle">Die Boundary</text>

  <!-- IO ring (outer ring) -->
  <rect x="50" y="58" width="600" height="330" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- Core area (inside IO ring) -->
  <rect x="90" y="90" width="520" height="265" rx="2" fill="#0d1117" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="350" y="86" fill="#3fb950" font-size="10" text-anchor="middle">Core Area (standard cells + macros)</text>

  <!-- CPU Core macro -->
  <rect x="100" y="100" width="200" height="150" rx="4" fill="#1e2936" stroke="#58a6ff" stroke-width="2"/>
  <text x="200" y="168" fill="#58a6ff" font-size="13" font-weight="bold" text-anchor="middle">CPU Core</text>
  <text x="200" y="184" fill="#8b949e" font-size="10" text-anchor="middle">Hard Macro</text>
  <text x="200" y="197" fill="#8b949e" font-size="9" text-anchor="middle">200×150 μm</text>

  <!-- GPU/DSP macro -->
  <rect x="320" y="100" width="170" height="130" rx="4" fill="#1e2936" stroke="#ffa657" stroke-width="2"/>
  <text x="405" y="165" fill="#ffa657" font-size="12" font-weight="bold" text-anchor="middle">GPU/DSP</text>
  <text x="405" y="180" fill="#8b949e" font-size="10" text-anchor="middle">Hard Macro</text>

  <!-- SRAM blocks -->
  <rect x="100" y="270" width="80" height="70" rx="3" fill="#1a3a1a" stroke="#3fb950" stroke-width="1.5"/>
  <text x="140" y="302" fill="#3fb950" font-size="10" font-weight="bold" text-anchor="middle">SRAM</text>
  <text x="140" y="315" fill="#8b949e" font-size="9" text-anchor="middle">512KB</text>

  <rect x="195" y="270" width="80" height="70" rx="3" fill="#1a3a1a" stroke="#3fb950" stroke-width="1.5"/>
  <text x="235" y="302" fill="#3fb950" font-size="10" font-weight="bold" text-anchor="middle">SRAM</text>
  <text x="235" y="315" fill="#8b949e" font-size="9" text-anchor="middle">512KB</text>

  <!-- Standard cell region -->
  <rect x="320" y="248" width="285" height="95" rx="3" fill="#1a1a2e" stroke="#9e6bdb" stroke-width="1.5"/>
  <text x="462" y="292" fill="#9e6bdb" font-size="11" font-weight="bold" text-anchor="middle">Standard Cell Region</text>
  <text x="462" y="307" fill="#8b949e" font-size="9" text-anchor="middle">Logic gates, FFs, buffers</text>
  <!-- Cell rows suggestion -->
  <line x1="330" y1="260" x2="595" y2="260" stroke="#9e6bdb" stroke-width="0.5" opacity="0.4"/>
  <line x1="330" y1="270" x2="595" y2="270" stroke="#9e6bdb" stroke-width="0.5" opacity="0.4"/>
  <line x1="330" y1="280" x2="595" y2="280" stroke="#9e6bdb" stroke-width="0.5" opacity="0.4"/>

  <!-- PLL -->
  <rect x="500" y="100" width="100" height="60" rx="3" fill="#2a1a1a" stroke="#ff7b72" stroke-width="1.5"/>
  <text x="550" y="128" fill="#ff7b72" font-size="11" font-weight="bold" text-anchor="middle">PLL</text>
  <text x="550" y="143" fill="#8b949e" font-size="9" text-anchor="middle">Clock Gen</text>

  <!-- Power stripes (vertical) -->
  <rect x="295" y="90" width="8" height="265" fill="#ffa657" opacity="0.25" rx="1"/>
  <text x="299" y="82" fill="#ffa657" font-size="8" text-anchor="middle">VDD</text>
  <rect x="310" y="90" width="8" height="265" fill="#8b949e" opacity="0.25" rx="1"/>
  <text x="314" y="82" fill="#8b949e" font-size="8" text-anchor="middle">VSS</text>

  <!-- IO pads (simplified - small rectangles on border) -->
  <!-- Bottom IOs -->
  <rect x="120" y="368" width="20" height="12" rx="1" fill="#58a6ff" opacity="0.8"/>
  <rect x="155" y="368" width="20" height="12" rx="1" fill="#58a6ff" opacity="0.8"/>
  <rect x="190" y="368" width="20" height="12" rx="1" fill="#58a6ff" opacity="0.8"/>
  <rect x="225" y="368" width="20" height="12" rx="1" fill="#58a6ff" opacity="0.8"/>
  <rect x="350" y="368" width="20" height="12" rx="1" fill="#58a6ff" opacity="0.8"/>
  <rect x="400" y="368" width="20" height="12" rx="1" fill="#58a6ff" opacity="0.8"/>
  <text x="350" y="394" fill="#58a6ff" font-size="9" text-anchor="middle">I/O Pads (data, addr, ctrl)</text>

  <!-- Power pads -->
  <rect x="460" y="368" width="16" height="12" rx="1" fill="#ffa657" opacity="0.9"/>
  <rect x="480" y="368" width="16" height="12" rx="1" fill="#8b949e" opacity="0.9"/>
  <text x="492" y="394" fill="#ffa657" font-size="9">VDD/VSS</text>

  <!-- Legend -->
  <rect x="55" y="370" width="12" height="10" fill="#1e2936" stroke="#58a6ff" stroke-width="1.5" rx="1"/>
  <text x="72" y="379" fill="#8b949e" font-size="9">Hard Macro</text>
  <rect x="135" y="370" width="12" height="10" fill="#1a3a1a" stroke="#3fb950" stroke-width="1.5" rx="1"/>
  <text x="152" y="379" fill="#8b949e" font-size="9">SRAM</text>
  <rect x="195" y="370" width="12" height="10" fill="#1a1a2e" stroke="#9e6bdb" stroke-width="1.5" rx="1"/>
  <text x="212" y="379" fill="#8b949e" font-size="9">Std Cells</text>
  <rect x="265" y="370" width="12" height="10" fill="#ffa657" opacity="0.3" rx="1"/>
  <text x="282" y="379" fill="#8b949e" font-size="9">Power Stripe</text>
</svg>
