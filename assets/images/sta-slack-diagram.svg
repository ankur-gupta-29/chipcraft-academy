<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" style="background:#0d1117;font-family:ui-monospace,monospace;">
  <rect width="720" height="340" fill="#0d1117"/>
  <text x="360" y="28" fill="#e6edf3" font-size="15" font-weight="bold" text-anchor="middle">STA Timing Path &amp; Slack Calculation</text>

  <defs>
    <marker id="slk" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3fb950"/>
    </marker>
    <marker id="slkl" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <polygon points="0 0, 8 3, 0 6" fill="#3fb950"/>
    </marker>
    <marker id="dat" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ffa657"/>
    </marker>
    <marker id="clkm" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#58a6ff"/>
    </marker>
  </defs>

  <!-- Launch FF -->
  <rect x="40" y="120" width="100" height="80" rx="6" fill="#1e2936" stroke="#58a6ff" stroke-width="2"/>
  <text x="90" y="155" fill="#58a6ff" font-size="11" font-weight="bold" text-anchor="middle">Launch</text>
  <text x="90" y="170" fill="#58a6ff" font-size="11" font-weight="bold" text-anchor="middle">FF</text>
  <text x="90" y="188" fill="#8b949e" font-size="9" text-anchor="middle">clocked by CLK</text>
  <!-- Clock symbol -->
  <text x="65" y="148" fill="#58a6ff" font-size="9">▶</text>

  <!-- Combinational Logic cloud -->
  <ellipse cx="360" cy="160" rx="100" ry="45" fill="#1e2936" stroke="#ffa657" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="360" y="155" fill="#ffa657" font-size="11" text-anchor="middle">Combinational</text>
  <text x="360" y="170" fill="#ffa657" font-size="11" text-anchor="middle">Logic</text>

  <!-- Capture FF -->
  <rect x="580" y="120" width="100" height="80" rx="6" fill="#1e2936" stroke="#58a6ff" stroke-width="2"/>
  <text x="630" y="155" fill="#58a6ff" font-size="11" font-weight="bold" text-anchor="middle">Capture</text>
  <text x="630" y="170" fill="#58a6ff" font-size="11" font-weight="bold" text-anchor="middle">FF</text>
  <text x="630" y="188" fill="#8b949e" font-size="9" text-anchor="middle">clocked by CLK</text>
  <text x="605" y="148" fill="#58a6ff" font-size="9">▶</text>

  <!-- Data path arrows -->
  <line x1="140" y1="155" x2="260" y2="155" stroke="#ffa657" stroke-width="2" marker-end="url(#dat)"/>
  <text x="200" y="145" fill="#ffa657" font-size="10" text-anchor="middle">Tcq</text>
  <line x1="460" y1="155" x2="580" y2="155" stroke="#ffa657" stroke-width="2" marker-end="url(#dat)"/>
  <text x="520" y="145" fill="#ffa657" font-size="10" text-anchor="middle">routing</text>

  <!-- Clock path (below) -->
  <line x1="90" y1="220" x2="90" y2="255" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="90" y1="255" x2="630" y2="255" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="630" y1="255" x2="630" y2="220" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="360" y="270" fill="#58a6ff" font-size="10" text-anchor="middle">CLK (Tclk = period)</text>

  <!-- Timeline at bottom -->
  <line x1="60" y1="310" x2="680" y2="310" stroke="#30363d" stroke-width="2"/>
  <text x="360" y="325" fill="#8b949e" font-size="9" text-anchor="middle">Time →</text>

  <!-- Data arrival bar -->
  <rect x="60" y="290" width="380" height="14" rx="3" fill="#ffa657" opacity="0.7"/>
  <text x="250" y="302" fill="#0d1117" font-size="9" text-anchor="middle" font-weight="bold">Data Arrival = Tcq + Tlogic</text>

  <!-- Required time dashed line -->
  <line x1="540" y1="275" x2="540" y2="315" stroke="#3fb950" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="540" y="273" fill="#3fb950" font-size="9" text-anchor="middle">Required = Tclk − Tsu</text>

  <!-- Slack double arrow -->
  <line x1="440" y1="297" x2="540" y2="297" stroke="#3fb950" stroke-width="2" marker-end="url(#slk)" marker-start="url(#slkl)"/>
  <text x="490" y="288" fill="#3fb950" font-size="10" text-anchor="middle" font-weight="bold">SLACK</text>
  <text x="490" y="282" fill="#3fb950" font-size="9" text-anchor="middle">(positive = met ✓)</text>

  <!-- Tsu bracket -->
  <rect x="540" y="290" width="100" height="14" rx="3" fill="#ff7b72" opacity="0.5"/>
  <text x="590" y="302" fill="#e6edf3" font-size="9" text-anchor="middle">Tsu window</text>

  <!-- Formula -->
  <text x="360" y="50" fill="#c9d1d9" font-size="11" text-anchor="middle">Setup Slack = Tclk − Tsu − Tcq − Tlogic + Tskew</text>
  <text x="360" y="66" fill="#8b949e" font-size="10" text-anchor="middle">Positive slack → timing met   |   Negative slack → setup violation ⚠</text>
</svg>
