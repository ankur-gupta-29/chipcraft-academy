<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" style="background:#0d1117;font-family:ui-monospace,monospace;">
  <rect width="700" height="400" fill="#0d1117"/>
  <text x="350" y="26" fill="#e6edf3" font-size="14" font-weight="bold" text-anchor="middle">Clock Tree Synthesis — H-Tree Topology</text>
  <text x="350" y="44" fill="#8b949e" font-size="10" text-anchor="middle">Equal wire lengths from source to every leaf FF → equal insertion delay → minimal skew</text>

  <!-- Clock source -->
  <rect x="310" y="58" width="80" height="32" rx="5" fill="#2a1a2e" stroke="#9e6bdb" stroke-width="2"/>
  <text x="350" y="79" fill="#9e6bdb" font-size="11" font-weight="bold" text-anchor="middle">CLK SRC</text>

  <!-- Level 1 trunk -->
  <line x1="350" y1="90" x2="350" y2="120" stroke="#9e6bdb" stroke-width="3"/>

  <!-- Level 1 horizontal split -->
  <line x1="175" y1="120" x2="525" y2="120" stroke="#9e6bdb" stroke-width="3"/>

  <!-- Buffers at level 1 split points -->
  <rect x="140" y="110" width="70" height="20" rx="4" fill="#1a1a2e" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="175" y="124" fill="#58a6ff" font-size="9" text-anchor="middle">BUF (Lvl1)</text>
  <rect x="490" y="110" width="70" height="20" rx="4" fill="#1a1a2e" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="525" y="124" fill="#58a6ff" font-size="9" text-anchor="middle">BUF (Lvl1)</text>

  <!-- Level 2 vertical drops -->
  <line x1="175" y1="130" x2="175" y2="170" stroke="#58a6ff" stroke-width="2.5"/>
  <line x1="525" y1="130" x2="525" y2="170" stroke="#58a6ff" stroke-width="2.5"/>

  <!-- Level 2 horizontal splits -->
  <line x1="100" y1="170" x2="250" y2="170" stroke="#58a6ff" stroke-width="2.5"/>
  <line x1="450" y1="170" x2="600" y2="170" stroke="#58a6ff" stroke-width="2.5"/>

  <!-- Level 2 buffers -->
  <rect x="65" y="162" width="70" height="18" rx="3" fill="#1a2e1a" stroke="#3fb950" stroke-width="1.5"/>
  <text x="100" y="175" fill="#3fb950" font-size="8" text-anchor="middle">BUF (Lvl2)</text>
  <rect x="215" y="162" width="70" height="18" rx="3" fill="#1a2e1a" stroke="#3fb950" stroke-width="1.5"/>
  <text x="250" y="175" fill="#3fb950" font-size="8" text-anchor="middle">BUF (Lvl2)</text>
  <rect x="415" y="162" width="70" height="18" rx="3" fill="#1a2e1a" stroke="#3fb950" stroke-width="1.5"/>
  <text x="450" y="175" fill="#3fb950" font-size="8" text-anchor="middle">BUF (Lvl2)</text>
  <rect x="565" y="162" width="70" height="18" rx="3" fill="#1a2e1a" stroke="#3fb950" stroke-width="1.5"/>
  <text x="600" y="175" fill="#3fb950" font-size="8" text-anchor="middle">BUF (Lvl2)</text>

  <!-- Level 3 vertical drops to leaf FFs -->
  <line x1="100" y1="180" x2="100" y2="220" stroke="#3fb950" stroke-width="2"/>
  <line x1="250" y1="180" x2="250" y2="220" stroke="#3fb950" stroke-width="2"/>
  <line x1="450" y1="180" x2="450" y2="220" stroke="#3fb950" stroke-width="2"/>
  <line x1="600" y1="180" x2="600" y2="220" stroke="#3fb950" stroke-width="2"/>

  <!-- Level 3 horizontal splits -->
  <line x1="62" y1="220" x2="138" y2="220" stroke="#3fb950" stroke-width="2"/>
  <line x1="212" y1="220" x2="288" y2="220" stroke="#3fb950" stroke-width="2"/>
  <line x1="412" y1="220" x2="488" y2="220" stroke="#3fb950" stroke-width="2"/>
  <line x1="562" y1="220" x2="638" y2="220" stroke="#3fb950" stroke-width="2"/>

  <!-- Leaf FF drops -->
  <!-- Left subtree -->
  <line x1="62"  y1="220" x2="62"  y2="260" stroke="#3fb950" stroke-width="1.5"/>
  <line x1="138" y1="220" x2="138" y2="260" stroke="#3fb950" stroke-width="1.5"/>
  <line x1="212" y1="220" x2="212" y2="260" stroke="#3fb950" stroke-width="1.5"/>
  <line x1="288" y1="220" x2="288" y2="260" stroke="#3fb950" stroke-width="1.5"/>
  <!-- Right subtree -->
  <line x1="412" y1="220" x2="412" y2="260" stroke="#3fb950" stroke-width="1.5"/>
  <line x1="488" y1="220" x2="488" y2="260" stroke="#3fb950" stroke-width="1.5"/>
  <line x1="562" y1="220" x2="562" y2="260" stroke="#3fb950" stroke-width="1.5"/>
  <line x1="638" y1="220" x2="638" y2="260" stroke="#3fb950" stroke-width="1.5"/>

  <!-- Leaf FFs (8 total) -->
  {% for pos in "62,138,212,288,412,488,562,638" %}{% endfor %}
  <rect x="40"  y="260" width="44" height="26" rx="3" fill="#1a2936" stroke="#ffa657" stroke-width="1.5"/>
  <text x="62"  y="277" fill="#ffa657" font-size="9" text-anchor="middle">FF</text>
  <rect x="116" y="260" width="44" height="26" rx="3" fill="#1a2936" stroke="#ffa657" stroke-width="1.5"/>
  <text x="138" y="277" fill="#ffa657" font-size="9" text-anchor="middle">FF</text>
  <rect x="190" y="260" width="44" height="26" rx="3" fill="#1a2936" stroke="#ffa657" stroke-width="1.5"/>
  <text x="212" y="277" fill="#ffa657" font-size="9" text-anchor="middle">FF</text>
  <rect x="266" y="260" width="44" height="26" rx="3" fill="#1a2936" stroke="#ffa657" stroke-width="1.5"/>
  <text x="288" y="277" fill="#ffa657" font-size="9" text-anchor="middle">FF</text>
  <rect x="390" y="260" width="44" height="26" rx="3" fill="#1a2936" stroke="#ffa657" stroke-width="1.5"/>
  <text x="412" y="277" fill="#ffa657" font-size="9" text-anchor="middle">FF</text>
  <rect x="466" y="260" width="44" height="26" rx="3" fill="#1a2936" stroke="#ffa657" stroke-width="1.5"/>
  <text x="488" y="277" fill="#ffa657" font-size="9" text-anchor="middle">FF</text>
  <rect x="540" y="260" width="44" height="26" rx="3" fill="#1a2936" stroke="#ffa657" stroke-width="1.5"/>
  <text x="562" y="277" fill="#ffa657" font-size="9" text-anchor="middle">FF</text>
  <rect x="616" y="260" width="44" height="26" rx="3" fill="#1a2936" stroke="#ffa657" stroke-width="1.5"/>
  <text x="638" y="277" fill="#ffa657" font-size="9" text-anchor="middle">FF</text>

  <!-- Equal path length annotation -->
  <rect x="60" y="308" width="580" height="70" rx="6" fill="#161b22" stroke="#444" stroke-width="1"/>
  <text x="350" y="326" fill="#e6edf3" font-size="11" font-weight="bold" text-anchor="middle">Key CTS Metrics</text>
  <text x="130" y="348" fill="#3fb950" font-size="10" text-anchor="middle">Clock Skew</text>
  <text x="130" y="363" fill="#8b949e" font-size="9" text-anchor="middle">Target &lt; 50 ps</text>
  <text x="280" y="348" fill="#58a6ff" font-size="10" text-anchor="middle">Insertion Delay</text>
  <text x="280" y="363" fill="#8b949e" font-size="9" text-anchor="middle">Clk source → FF CK</text>
  <text x="440" y="348" fill="#ffa657" font-size="10" text-anchor="middle">Buffer Levels</text>
  <text x="440" y="363" fill="#8b949e" font-size="9" text-anchor="middle">Typ. 4–8 for large die</text>
  <text x="590" y="348" fill="#9e6bdb" font-size="10" text-anchor="middle">NDR Rules</text>
  <text x="590" y="363" fill="#8b949e" font-size="9" text-anchor="middle">2× width, 2× spacing</text>
  <!-- dividers -->
  <line x1="205" y1="315" x2="205" y2="370" stroke="#333" stroke-width="1"/>
  <line x1="360" y1="315" x2="360" y2="370" stroke="#333" stroke-width="1"/>
  <line x1="515" y1="315" x2="515" y2="370" stroke="#333" stroke-width="1"/>
</svg>
