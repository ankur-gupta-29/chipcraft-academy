<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" style="background:#0d1117;font-family:ui-monospace,monospace;">
  <rect width="700" height="400" fill="#0d1117"/>
  <text x="350" y="28" fill="#e6edf3" font-size="15" font-weight="bold" text-anchor="middle">RTL Synthesis Flow — Design Compiler</text>
  <defs>
    <marker id="dca" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c9d1d9"/>
    </marker>
  </defs>
  <!-- Step boxes -->
  <!-- RTL Input -->
  <rect x="260" y="48" width="180" height="44" rx="6" fill="#1e2936" stroke="#58a6ff" stroke-width="2"/>
  <text x="350" y="65" fill="#e6edf3" font-size="11" font-weight="bold" text-anchor="middle">RTL Sources</text>
  <text x="350" y="81" fill="#8b949e" font-size="10" text-anchor="middle">.v / .sv files</text>
  <!-- Arrow -->
  <line x1="350" y1="92" x2="350" y2="112" stroke="#c9d1d9" stroke-width="2" marker-end="url(#dca)"/>

  <!-- Elaborate -->
  <rect x="240" y="112" width="220" height="44" rx="6" fill="#1e2936" stroke="#3fb950" stroke-width="2"/>
  <text x="350" y="129" fill="#e6edf3" font-size="11" font-weight="bold" text-anchor="middle">read_verilog + elaborate</text>
  <text x="350" y="145" fill="#8b949e" font-size="10" text-anchor="middle">Parse RTL → generic netlist</text>
  <!-- Side note -->
  <text x="480" y="134" fill="#8b949e" font-size="9">check for</text>
  <text x="480" y="146" fill="#8b949e" font-size="9">syntax errors</text>
  <line x1="460" y1="136" x2="478" y2="136" stroke="#8b949e" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Arrow -->
  <line x1="350" y1="156" x2="350" y2="176" stroke="#c9d1d9" stroke-width="2" marker-end="url(#dca)"/>

  <!-- Constraints -->
  <rect x="240" y="176" width="220" height="44" rx="6" fill="#1e2936" stroke="#ffa657" stroke-width="2"/>
  <text x="350" y="193" fill="#e6edf3" font-size="11" font-weight="bold" text-anchor="middle">source design.sdc</text>
  <text x="350" y="209" fill="#8b949e" font-size="10" text-anchor="middle">Apply timing constraints</text>
  <!-- Side note -->
  <text x="480" y="193" fill="#ffa657" font-size="9">create_clock</text>
  <text x="480" y="205" fill="#ffa657" font-size="9">set_input/output_delay</text>
  <line x1="460" y1="197" x2="478" y2="197" stroke="#ffa657" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Arrow -->
  <line x1="350" y1="220" x2="350" y2="240" stroke="#c9d1d9" stroke-width="2" marker-end="url(#dca)"/>

  <!-- Compile -->
  <rect x="220" y="240" width="260" height="44" rx="6" fill="#1a2e1a" stroke="#3fb950" stroke-width="2.5"/>
  <text x="350" y="257" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">compile_ultra</text>
  <text x="350" y="273" fill="#8b949e" font-size="10" text-anchor="middle">Technology mapping → gate netlist</text>
  <!-- Arrow -->
  <line x1="350" y1="284" x2="350" y2="304" stroke="#c9d1d9" stroke-width="2" marker-end="url(#dca)"/>

  <!-- Outputs -->
  <rect x="160" y="304" width="380" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="350" y="322" fill="#e6edf3" font-size="11" font-weight="bold" text-anchor="middle">Outputs</text>
  <!-- 3 output items -->
  <rect x="175" y="330" width="100" height="24" rx="3" fill="#1e2936" stroke="#3fb950" stroke-width="1"/>
  <text x="225" y="346" fill="#3fb950" font-size="9" text-anchor="middle">netlist.v (gate)</text>
  <rect x="295" y="330" width="100" height="24" rx="3" fill="#1e2936" stroke="#ffa657" stroke-width="1"/>
  <text x="345" y="346" fill="#ffa657" font-size="9" text-anchor="middle">timing_report.txt</text>
  <rect x="415" y="330" width="100" height="24" rx="3" fill="#1e2936" stroke="#58a6ff" stroke-width="1"/>
  <text x="465" y="346" fill="#58a6ff" font-size="9" text-anchor="middle">design.sdf / .spef</text>

  <!-- Tech library input (side) -->
  <rect x="60" y="240" width="130" height="44" rx="6" fill="#2a1a2e" stroke="#9e6bdb" stroke-width="1.5"/>
  <text x="125" y="257" fill="#9e6bdb" font-size="10" font-weight="bold" text-anchor="middle">Technology</text>
  <text x="125" y="271" fill="#9e6bdb" font-size="10" text-anchor="middle">Library (.db/.lib)</text>
  <line x1="190" y1="262" x2="220" y2="262" stroke="#9e6bdb" stroke-width="1.5" marker-end="url(#dca)"/>
  <text x="125" y="290" fill="#8b949e" font-size="9" text-anchor="middle">std cells, timing, power</text>
</svg>
