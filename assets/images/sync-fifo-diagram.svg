<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" style="background:#0d1117;font-family:ui-monospace,monospace;">
  <rect width="700" height="400" fill="#0d1117"/>
  <text x="350" y="26" fill="#e6edf3" font-size="14" font-weight="bold" text-anchor="middle">Synchronous FIFO — Circular Buffer with Read/Write Pointers</text>

  <!-- Circular buffer slots (8 entries) arranged in a ring -->
  <!-- Center of ring: 350, 200. Radius: 110 -->
  <!-- Slots at angles: 0,45,90,135,180,225,270,315 degrees -->

  <!-- Memory array (rectangular for clarity) -->
  <rect x="220" y="60" width="260" height="220" rx="6" fill="#161b22" stroke="#444" stroke-width="1.5"/>
  <text x="350" y="82" fill="#8b949e" font-size="10" text-anchor="middle">FIFO Memory Array (DEPTH=8, WIDTH=8)</text>

  <!-- 8 memory rows -->
  <!-- Row 0 -->
  <rect x="230" y="88" width="240" height="22" rx="2" fill="#1e2936" stroke="#444" stroke-width="1"/>
  <text x="260" y="104" fill="#8b949e" font-size="9" text-anchor="middle">addr[0]</text>
  <text x="380" y="104" fill="#e6edf3" font-size="9" text-anchor="middle">0xA3</text>
  <!-- Row 1 -->
  <rect x="230" y="112" width="240" height="22" rx="2" fill="#1e2936" stroke="#444" stroke-width="1"/>
  <text x="260" y="128" fill="#8b949e" font-size="9" text-anchor="middle">addr[1]</text>
  <text x="380" y="128" fill="#e6edf3" font-size="9" text-anchor="middle">0x7F</text>
  <!-- Row 2 — read pointer here -->
  <rect x="230" y="136" width="240" height="22" rx="2" fill="#1a2e1a" stroke="#3fb950" stroke-width="2"/>
  <text x="260" y="152" fill="#3fb950" font-size="9" font-weight="bold" text-anchor="middle">addr[2] ← RD</text>
  <text x="380" y="152" fill="#3fb950" font-size="9" text-anchor="middle">0x55</text>
  <!-- Row 3 -->
  <rect x="230" y="160" width="240" height="22" rx="2" fill="#1e2936" stroke="#444" stroke-width="1"/>
  <text x="260" y="176" fill="#8b949e" font-size="9" text-anchor="middle">addr[3]</text>
  <text x="380" y="176" fill="#e6edf3" font-size="9" text-anchor="middle">0x21</text>
  <!-- Row 4 -->
  <rect x="230" y="184" width="240" height="22" rx="2" fill="#1e2936" stroke="#444" stroke-width="1"/>
  <text x="260" y="200" fill="#8b949e" font-size="9" text-anchor="middle">addr[4]</text>
  <text x="380" y="200" fill="#e6edf3" font-size="9" text-anchor="middle">0xCC</text>
  <!-- Row 5 — write pointer here -->
  <rect x="230" y="208" width="240" height="22" rx="2" fill="#2e1a1a" stroke="#ffa657" stroke-width="2"/>
  <text x="260" y="224" fill="#ffa657" font-size="9" font-weight="bold" text-anchor="middle">addr[5] ← WR</text>
  <text x="380" y="224" fill="#ffa657" font-size="9" text-anchor="middle">(next write)</text>
  <!-- Row 6 -->
  <rect x="230" y="232" width="240" height="22" rx="2" fill="#161b22" stroke="#333" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="260" y="248" fill="#555" font-size="9" text-anchor="middle">addr[6]</text>
  <text x="380" y="248" fill="#555" font-size="9" text-anchor="middle">(empty)</text>
  <!-- Row 7 -->
  <rect x="230" y="256" width="240" height="22" rx="2" fill="#161b22" stroke="#333" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="260" y="272" fill="#555" font-size="9" text-anchor="middle">addr[7]</text>
  <text x="380" y="272" fill="#555" font-size="9" text-anchor="middle">(empty)</text>

  <!-- Read pointer arrow -->
  <line x1="120" y1="147" x2="228" y2="147" stroke="#3fb950" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="30" y="132" width="90" height="28" rx="4" fill="#1a2e1a" stroke="#3fb950" stroke-width="1.5"/>
  <text x="75" y="149" fill="#3fb950" font-size="10" font-weight="bold" text-anchor="middle">rd_ptr=2</text>

  <!-- Write pointer arrow -->
  <line x1="120" y1="219" x2="228" y2="219" stroke="#ffa657" stroke-width="2" marker-end="url(#aw2)"/>
  <rect x="30" y="204" width="90" height="28" rx="4" fill="#2e1a1a" stroke="#ffa657" stroke-width="1.5"/>
  <text x="75" y="221" fill="#ffa657" font-size="10" font-weight="bold" text-anchor="middle">wr_ptr=5</text>

  <defs>
    <marker id="ar" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0,7 3,0 6" fill="#3fb950"/>
    </marker>
    <marker id="aw2" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0,7 3,0 6" fill="#ffa657"/>
    </marker>
  </defs>

  <!-- Fill level indicator -->
  <rect x="500" y="68" width="170" height="200" rx="6" fill="#161b22" stroke="#444" stroke-width="1.5"/>
  <text x="585" y="90" fill="#e6edf3" font-size="11" font-weight="bold" text-anchor="middle">Fill Level</text>
  <!-- Fill bar background -->
  <rect x="530" y="100" width="40" height="140" rx="3" fill="#1e2936" stroke="#444" stroke-width="1"/>
  <!-- Fill bar (3/8 filled) -->
  <rect x="530" y="187" width="40" height="53" rx="3" fill="#58a6ff"/>
  <text x="585" y="155" fill="#58a6ff" font-size="18" font-weight="bold" text-anchor="middle">3</text>
  <text x="585" y="172" fill="#8b949e" font-size="10" text-anchor="middle">entries used</text>
  <text x="585" y="215" fill="#8b949e" font-size="10" text-anchor="middle">5 free</text>
  <!-- empty flag -->
  <rect x="510" y="248" width="55" height="18" rx="3" fill="#1a2e1a" stroke="#3fb950" stroke-width="1"/>
  <text x="537" y="261" fill="#3fb950" font-size="9" text-anchor="middle">empty=0</text>
  <!-- full flag -->
  <rect x="575" y="248" width="45" height="18" rx="3" fill="#2e1a1a" stroke="#ff7b72" stroke-width="1"/>
  <text x="597" y="261" fill="#ff7b72" font-size="9" text-anchor="middle">full=0</text>

  <!-- Pointer width formula -->
  <rect x="30" y="310" width="640" height="72" rx="6" fill="#161b22" stroke="#444" stroke-width="1.5"/>
  <text x="350" y="330" fill="#e6edf3" font-size="11" font-weight="bold" text-anchor="middle">Pointer Width = log₂(DEPTH) + 1 extra bit — Key to full/empty detection</text>
  <text x="350" y="350" fill="#3fb950" font-size="10" text-anchor="middle">empty = (wr_ptr == rd_ptr)   — all bits equal including MSB</text>
  <text x="350" y="368" fill="#ff7b72" font-size="10" text-anchor="middle">full  = (wr_ptr[MSB] != rd_ptr[MSB]) &amp;&amp; (wr_ptr[MSB-1:0] == rd_ptr[MSB-1:0])</text>
</svg>
