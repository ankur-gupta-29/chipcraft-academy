<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" style="background:#0d1117;font-family:ui-monospace,monospace;">
  <rect width="700" height="380" fill="#0d1117"/>
  <text x="350" y="28" fill="#e6edf3" font-size="15" font-weight="bold" text-anchor="middle">Async FIFO — Gray-Coded Pointer Synchronization</text>

  <defs>
    <marker id="fa" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c9d1d9"/>
    </marker>
    <marker id="fb" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/>
    </marker>
    <marker id="fc" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- Write domain (left, blue) -->
  <rect x="15" y="48" width="245" height="310" rx="8" fill="#0d1529" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="137" y="68" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">Write Domain (clk_w)</text>

  <!-- Read domain (right, green) -->
  <rect x="440" y="48" width="245" height="310" rx="8" fill="#0d1a0d" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="563" y="68" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">Read Domain (clk_r)</text>

  <!-- Central FIFO memory -->
  <rect x="275" y="100" width="150" height="170" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <text x="350" y="155" fill="#e6edf3" font-size="11" font-weight="bold" text-anchor="middle">FIFO Memory</text>
  <text x="350" y="172" fill="#8b949e" font-size="10" text-anchor="middle">2^N × WIDTH</text>
  <text x="350" y="189" fill="#8b949e" font-size="9" text-anchor="middle">Dual-port SRAM</text>

  <!-- wdata input -->
  <text x="50" y="115" fill="#c9d1d9" font-size="11" text-anchor="middle">wdata</text>
  <line x1="50" y1="120" x2="275" y2="180" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#fb)"/>
  <text x="140" y="148" fill="#58a6ff" font-size="9">Write Port</text>

  <!-- rdata output -->
  <text x="650" y="115" fill="#c9d1d9" font-size="11" text-anchor="middle">rdata</text>
  <line x1="425" y1="180" x2="650" y2="120" stroke="#3fb950" stroke-width="1.5" marker-end="url(#fc)"/>
  <text x="560" y="148" fill="#3fb950" font-size="9">Read Port</text>

  <!-- Write pointer flow -->
  <rect x="35" y="220" width="100" height="32" rx="4" fill="#1e2936" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="85" y="240" fill="#e6edf3" font-size="10" text-anchor="middle">wptr (binary)</text>
  <line x1="135" y1="236" x2="170" y2="236" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#fb)"/>

  <rect x="170" y="220" width="80" height="32" rx="4" fill="#1e2936" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="210" y="240" fill="#e6edf3" font-size="10" text-anchor="middle">bin2gray</text>
  <text x="85" y="280" fill="#ffa657" font-size="9" text-anchor="middle">wptr_gray →</text>

  <!-- wptr_gray synced to read domain -->
  <line x1="250" y1="236" x2="440" y2="290" stroke="#ffa657" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#fa)"/>
  <text x="350" y="268" fill="#ffa657" font-size="9" text-anchor="middle">2-FF Sync (clk_r)</text>

  <!-- Empty logic -->
  <rect x="450" y="285" width="120" height="28" rx="4" fill="#1a3a1a" stroke="#3fb950" stroke-width="1.5"/>
  <text x="510" y="303" fill="#3fb950" font-size="10" text-anchor="middle">Empty Logic</text>
  <text x="630" y="305" fill="#ff7b72" font-size="11" font-weight="bold">rempty</text>
  <line x1="570" y1="299" x2="620" y2="299" stroke="#ff7b72" stroke-width="1.5" marker-end="url(#fa)"/>

  <!-- Read pointer flow -->
  <rect x="565" y="220" width="100" height="32" rx="4" fill="#1e2936" stroke="#3fb950" stroke-width="1.5"/>
  <text x="615" y="240" fill="#e6edf3" font-size="10" text-anchor="middle">rptr (binary)</text>
  <line x1="565" y1="236" x2="520" y2="236" stroke="#3fb950" stroke-width="1.5" marker-end="url(#fc)"/>

  <rect x="450" y="220" width="70" height="32" rx="4" fill="#1e2936" stroke="#3fb950" stroke-width="1.5"/>
  <text x="485" y="240" fill="#e6edf3" font-size="10" text-anchor="middle">bin2gray</text>
  <text x="615" y="280" fill="#ffa657" font-size="9" text-anchor="middle">← rptr_gray</text>

  <!-- rptr_gray synced to write domain -->
  <line x1="450" y1="236" x2="255" y2="285" stroke="#ffa657" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#fa)"/>
  <text x="350" y="256" fill="#ffa657" font-size="9" text-anchor="middle">2-FF Sync (clk_w)</text>

  <!-- Full logic -->
  <rect x="130" y="280" width="120" height="28" rx="4" fill="#3a1a0a" stroke="#ffa657" stroke-width="1.5"/>
  <text x="190" y="298" fill="#ffa657" font-size="10" text-anchor="middle">Full Logic</text>
  <text x="60" y="298" fill="#ff7b72" font-size="11" font-weight="bold">wfull</text>
  <line x1="130" y1="294" x2="88" y2="294" stroke="#ff7b72" stroke-width="1.5" marker-end="url(#fa)"/>

  <!-- Domain boundary -->
  <line x1="350" y1="48" x2="350" y2="368" stroke="#8b949e" stroke-width="1" stroke-dasharray="3,4" opacity="0.5"/>

  <text x="350" y="362" fill="#8b949e" font-size="9" text-anchor="middle">Gray code: only 1 bit changes per increment → safe to synchronize</text>
</svg>
