<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" style="background:#0d1117;font-family:ui-monospace,monospace;">
  <rect width="700" height="320" fill="#0d1117"/>
  <text x="350" y="26" fill="#e6edf3" font-size="14" font-weight="bold" text-anchor="middle">AXI4 VALID/READY Handshake — Transfer on ↑CLK when VALID &amp; READY both HIGH</text>

  <defs>
    <marker id="aw" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0,6 3,0 6" fill="#c9d1d9"/>
    </marker>
  </defs>

  <!-- time axis -->
  <line x1="110" y1="300" x2="680" y2="300" stroke="#444" stroke-width="1" marker-end="url(#aw)"/>
  <text x="685" y="304" fill="#8b949e" font-size="9">time</text>

  <!-- clock edges at x = 160, 230, 300, 370, 440, 510, 580, 650 -->
  <!-- Row labels -->
  <text x="100" y="78"  fill="#8b949e" font-size="11" text-anchor="end">CLK</text>
  <text x="100" y="148" fill="#ffa657" font-size="11" text-anchor="end">VALID</text>
  <text x="100" y="218" fill="#3fb950" font-size="11" text-anchor="end">READY</text>
  <text x="100" y="278" fill="#58a6ff" font-size="11" text-anchor="end">Transfer</text>

  <!-- CLK waveform -->
  <polyline points="110,90 160,90 160,60 230,60 230,90 300,90 300,60 370,60 370,90 440,90 440,60 510,60 510,90 580,90 580,60 650,60 650,90 680,90" fill="none" stroke="#c9d1d9" stroke-width="2"/>

  <!-- VALID: low until x=230, high after -->
  <polyline points="110,160 230,160 230,130 650,130 650,160 680,160" fill="none" stroke="#ffa657" stroke-width="2.5"/>
  <text x="170" y="178" fill="#ffa657" font-size="9" text-anchor="middle">0</text>
  <text x="430" y="122" fill="#ffa657" font-size="9" text-anchor="middle">1 (master asserts)</text>

  <!-- READY: low until x=370, high after -->
  <polyline points="110,230 370,230 370,200 650,200 650,230 680,230" fill="none" stroke="#3fb950" stroke-width="2.5"/>
  <text x="240" y="248" fill="#3fb950" font-size="9" text-anchor="middle">0 (slave not ready)</text>
  <text x="510" y="192" fill="#3fb950" font-size="9" text-anchor="middle">1 (slave ready)</text>

  <!-- No transfer at clk 3 (300): VALID=1 READY=0 -->
  <!-- No transfer at clk 4 (370): edge, but READY just went high -->
  <!-- Transfer at clk 5 (440) -->
  <!-- Transfer markers - vertical dashed at 440 -->
  <line x1="440" y1="55" x2="440" y2="290" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Pulse for Transfer signal -->
  <polyline points="110,290 440,290 440,260 510,260 510,290 650,290 650,290" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="475" y="252" fill="#58a6ff" font-size="9" text-anchor="middle">Transfer!</text>

  <!-- Annotation: VALID=1 READY=0 = no transfer -->
  <text x="300" y="46" fill="#ff7b72" font-size="9" text-anchor="middle">VALID=1</text>
  <text x="300" y="57" fill="#ff7b72" font-size="9" text-anchor="middle">READY=0</text>
  <text x="300" y="68" fill="#ff7b72" font-size="9" text-anchor="middle">No xfer</text>

  <!-- Annotation: both high -->
  <text x="475" y="46" fill="#58a6ff" font-size="9" text-anchor="middle">VALID=1</text>
  <text x="475" y="57" fill="#58a6ff" font-size="9" text-anchor="middle">READY=1</text>
  <text x="475" y="68" fill="#58a6ff" font-size="9" text-anchor="middle">✓ Transfer</text>

  <!-- clock edge labels -->
  <text x="160" y="308" fill="#555" font-size="9" text-anchor="middle">↑1</text>
  <text x="230" y="308" fill="#555" font-size="9" text-anchor="middle">↑2</text>
  <text x="300" y="308" fill="#555" font-size="9" text-anchor="middle">↑3</text>
  <text x="370" y="308" fill="#555" font-size="9" text-anchor="middle">↑4</text>
  <text x="440" y="308" fill="#58a6ff" font-size="9" text-anchor="middle">↑5</text>
  <text x="510" y="308" fill="#555" font-size="9" text-anchor="middle">↑6</text>
</svg>
