<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" style="background:#0d1117;font-family:ui-monospace,monospace;">
  <rect width="720" height="380" fill="#0d1117"/>
  <text x="360" y="28" fill="#e6edf3" font-size="15" font-weight="bold" text-anchor="middle">Setup &amp; Hold Time Requirements</text>

  <!-- Row labels -->
  <text x="68" y="98" fill="#8b949e" font-size="11" text-anchor="end">clk</text>
  <text x="68" y="188" fill="#8b949e" font-size="11" text-anchor="end">data</text>
  <text x="68" y="278" fill="#8b949e" font-size="11" text-anchor="end">Q (output)</text>

  <!-- Horizontal baselines -->
  <line x1="80" y1="108" x2="680" y2="108" stroke="#21262d" stroke-width="1"/>
  <line x1="80" y1="198" x2="680" y2="198" stroke="#21262d" stroke-width="1"/>
  <line x1="80" y1="288" x2="680" y2="288" stroke="#21262d" stroke-width="1"/>

  <!-- CLK waveform: 2 cycles, period=180px, rising edge at x=320 -->
  <polyline points="80,118 80,68 230,68 230,118 320,118" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
  <polyline points="320,118 320,68 500,68 500,118 680,118" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="175" y="60" fill="#58a6ff" font-size="10" text-anchor="middle">Tclk = 10 ns</text>
  <line x1="80" y1="58" x2="230" y2="58" stroke="#58a6ff" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>
  <text x="230" y="58" fill="#58a6ff" font-size="10">→</text>

  <!-- DATA waveform: changes BEFORE rising edge, stable through it -->
  <!-- Data low before x=240, transitions at 240, stable high until x=380 -->
  <polyline points="80,208 240,208" fill="none" stroke="#c9d1d9" stroke-width="2"/>
  <!-- transition zone (slanted) -->
  <polyline points="240,208 260,168" fill="none" stroke="#c9d1d9" stroke-width="2"/>
  <!-- stable high from 260 to 380 -->
  <polyline points="260,168 380,168" fill="none" stroke="#c9d1d9" stroke-width="2"/>
  <!-- transition down at 380 -->
  <polyline points="380,168 400,208 680,208" fill="none" stroke="#c9d1d9" stroke-width="2"/>

  <!-- Setup window shading (before rising edge) - from 260 to 320 -->
  <rect x="260" y="158" width="60" height="55" fill="#1a3a1a" opacity="0.6"/>
  <text x="290" y="148" fill="#3fb950" font-size="10" text-anchor="middle" font-weight="bold">Setup</text>
  <text x="290" y="140" fill="#3fb950" font-size="9" text-anchor="middle">window</text>
  <!-- Tsu bracket -->
  <line x1="260" y1="230" x2="320" y2="230" stroke="#3fb950" stroke-width="2"/>
  <line x1="260" y1="225" x2="260" y2="235" stroke="#3fb950" stroke-width="2"/>
  <line x1="320" y1="225" x2="320" y2="235" stroke="#3fb950" stroke-width="2"/>
  <text x="290" y="248" fill="#3fb950" font-size="11" text-anchor="middle" font-weight="bold">Tsu</text>

  <!-- Hold window shading (after rising edge) - from 320 to 380 -->
  <rect x="320" y="158" width="60" height="55" fill="#3a2a0a" opacity="0.6"/>
  <text x="350" y="148" fill="#ffa657" font-size="10" text-anchor="middle" font-weight="bold">Hold</text>
  <text x="350" y="140" fill="#ffa657" font-size="9" text-anchor="middle">window</text>
  <!-- Th bracket -->
  <line x1="320" y1="230" x2="380" y2="230" stroke="#ffa657" stroke-width="2"/>
  <line x1="320" y1="225" x2="320" y2="235" stroke="#ffa657" stroke-width="2"/>
  <line x1="380" y1="225" x2="380" y2="235" stroke="#ffa657" stroke-width="2"/>
  <text x="350" y="248" fill="#ffa657" font-size="11" text-anchor="middle" font-weight="bold">Th</text>

  <!-- Rising edge marker -->
  <line x1="320" y1="55" x2="320" y2="310" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>
  <text x="320" y="310" fill="#58a6ff" font-size="9" text-anchor="middle">↑ Rising Edge</text>

  <!-- Q output: goes high after Tcq delay from rising edge -->
  <polyline points="80,288 320,288" fill="none" stroke="#ffa657" stroke-width="2"/>
  <!-- Tcq delay: 380-320=60, so Q changes at x=380 -->
  <polyline points="320,288 360,288 380,248 560,248" fill="none" stroke="#ffa657" stroke-width="2"/>
  <polyline points="560,248 580,288 680,288" fill="none" stroke="#ffa657" stroke-width="2"/>
  <!-- Tcq bracket -->
  <line x1="320" y1="330" x2="380" y2="330" stroke="#ffa657" stroke-width="1.5"/>
  <line x1="320" y1="325" x2="320" y2="335" stroke="#ffa657" stroke-width="1.5"/>
  <line x1="380" y1="325" x2="380" y2="335" stroke="#ffa657" stroke-width="1.5"/>
  <text x="350" y="348" fill="#ffa657" font-size="10" text-anchor="middle">Tcq (clk→Q delay)</text>

  <!-- Warning note -->
  <text x="360" y="368" fill="#8b949e" font-size="10" text-anchor="middle">Data must NOT change within the shaded setup or hold windows</text>
</svg>
