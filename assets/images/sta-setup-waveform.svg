<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" style="background:#161b22;border-radius:12px;font-family:monospace;">
  <text x="390" y="25" text-anchor="middle" fill="#8b949e" font-size="13">SETUP TIME ANALYSIS — Waveform</text>

  <!-- Y axis labels -->
  <text x="55" y="70" text-anchor="end" fill="#58a6ff" font-size="11">CLK</text>
  <text x="55" y="140" text-anchor="end" fill="#f0883e" font-size="11">DATA</text>
  <text x="55" y="210" text-anchor="end" fill="#bc8cff" font-size="11">CAPTURE</text>

  <!-- CLK waveform -->
  <polyline points="65,80 65,55 165,55 165,80 265,80 265,55 365,55 365,80 465,80 465,55 565,55 565,80 665,80 665,55 765,55 765,80" fill="none" stroke="#58a6ff" stroke-width="2"/>

  <!-- DATA path (arrives after clk edge + clk-to-Q + comb delay) -->
  <line x1="65" y1="150" x2="210" y2="150" stroke="#f0883e" stroke-width="2"/>
  <line x1="210" y1="150" x2="210" y2="125" stroke="#f0883e" stroke-width="2"/>
  <line x1="210" y1="125" x2="500" y2="125" stroke="#f0883e" stroke-width="2"/>
  <line x1="500" y1="125" x2="500" y2="150" stroke="#f0883e" stroke-width="2"/>
  <line x1="500" y1="150" x2="765" y2="150" stroke="#f0883e" stroke-width="2"/>

  <!-- Data arrival time marker -->
  <line x1="210" y1="55" x2="210" y2="175" stroke="#f0883e" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="215" y="175" fill="#f0883e" font-size="9">Data</text>
  <text x="215" y="186" fill="#f0883e" font-size="9">Arrives</text>

  <!-- Capture clock edge -->
  <line x1="465" y1="55" x2="465" y2="220" stroke="#bc8cff" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="470" y="230" fill="#bc8cff" font-size="9">Capture</text>
  <text x="470" y="241" fill="#bc8cff" font-size="9">Edge</text>

  <!-- Setup window marker -->
  <rect x="390" y="100" width="75" height="30" rx="3" fill="rgba(248,81,73,0.2)" stroke="#f85149" stroke-width="1"/>
  <text x="427" y="113" text-anchor="middle" fill="#f85149" font-size="9" font-weight="bold">Setup</text>
  <text x="427" y="125" text-anchor="middle" fill="#f85149" font-size="9">Window</text>

  <!-- Setup time arrow -->
  <line x1="395" y1="88" x2="460" y2="88" stroke="#f85149" stroke-width="1.5" marker-end="url(#arrow-red2)" marker-start="url(#arrow-red2-start)"/>
  <text x="427" y="83" text-anchor="middle" fill="#f85149" font-size="9">T_setup</text>

  <!-- Slack annotation -->
  <line x1="210" y1="50" x2="390" y2="50" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green2)" marker-start="url(#arrow-green2-start)"/>
  <text x="300" y="44" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">Slack (positive = PASS ✓)</text>

  <!-- Legend -->
  <rect x="65" y="248" width="12" height="3" fill="#58a6ff"/>
  <text x="82" y="254" fill="#8b949e" font-size="9">Clock</text>
  <rect x="125" y="248" width="12" height="3" fill="#f0883e"/>
  <text x="142" y="254" fill="#8b949e" font-size="9">Data path</text>
  <rect x="200" y="248" width="12" height="3" fill="#f85149"/>
  <text x="217" y="254" fill="#8b949e" font-size="9">Setup window (data must be stable)</text>

  <defs>
    <marker id="arrow-red2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#f85149"/>
    </marker>
    <marker id="arrow-red2-start" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L6,3 z" fill="#f85149"/>
    </marker>
    <marker id="arrow-green2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#3fb950"/>
    </marker>
    <marker id="arrow-green2-start" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L6,3 z" fill="#3fb950"/>
    </marker>
  </defs>
</svg>
