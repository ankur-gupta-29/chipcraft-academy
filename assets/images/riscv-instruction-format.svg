<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" style="background:#161b22;border-radius:12px;font-family:monospace;">
  <text x="430" y="25" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="bold">RISC-V 32-bit Instruction Formats</text>

  <!-- Bit position header -->
  <text x="75"  y="48" text-anchor="middle" fill="#8b949e" font-size="9">31-25</text>
  <text x="165" y="48" text-anchor="middle" fill="#8b949e" font-size="9">24-20</text>
  <text x="230" y="48" text-anchor="middle" fill="#8b949e" font-size="9">19-15</text>
  <text x="295" y="48" text-anchor="middle" fill="#8b949e" font-size="9">14-12</text>
  <text x="390" y="48" text-anchor="middle" fill="#8b949e" font-size="9">11-7</text>
  <text x="500" y="48" text-anchor="middle" fill="#8b949e" font-size="9">6-0</text>

  <!-- ── R-Type ── -->
  <text x="20" y="76" fill="#3fb950" font-size="11" font-weight="bold">R-Type</text>
  <text x="20" y="88" fill="#8b949e" font-size="8">ADD,SUB,AND…</text>
  <rect x="40"  y="93" width="100" height="24" rx="3" fill="#1c2128" stroke="#f0883e" stroke-width="1.5"/>
  <text x="90"  y="109" text-anchor="middle" fill="#f0883e" font-size="10">funct7</text>
  <rect x="140" y="93" width="55"  height="24" rx="3" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="167" y="109" text-anchor="middle" fill="#bc8cff" font-size="10">rs2</text>
  <rect x="195" y="93" width="55"  height="24" rx="3" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="222" y="109" text-anchor="middle" fill="#bc8cff" font-size="10">rs1</text>
  <rect x="250" y="93" width="55"  height="24" rx="3" fill="#1c2128" stroke="#f0883e" stroke-width="1.5"/>
  <text x="277" y="109" text-anchor="middle" fill="#f0883e" font-size="10">funct3</text>
  <rect x="305" y="93" width="110" height="24" rx="3" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
  <text x="360" y="109" text-anchor="middle" fill="#3fb950" font-size="10">rd</text>
  <rect x="415" y="93" width="110" height="24" rx="3" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="470" y="109" text-anchor="middle" fill="#58a6ff" font-size="10">opcode</text>

  <!-- ── I-Type ── -->
  <text x="20" y="140" fill="#58a6ff" font-size="11" font-weight="bold">I-Type</text>
  <text x="20" y="152" fill="#8b949e" font-size="8">ADDI,LW,JALR…</text>
  <rect x="40"  y="157" width="155" height="24" rx="3" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="117" y="173" text-anchor="middle" fill="#bc8cff" font-size="10">imm[11:0]</text>
  <rect x="195" y="157" width="55"  height="24" rx="3" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="222" y="173" text-anchor="middle" fill="#bc8cff" font-size="10">rs1</text>
  <rect x="250" y="157" width="55"  height="24" rx="3" fill="#1c2128" stroke="#f0883e" stroke-width="1.5"/>
  <text x="277" y="173" text-anchor="middle" fill="#f0883e" font-size="10">funct3</text>
  <rect x="305" y="157" width="110" height="24" rx="3" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
  <text x="360" y="173" text-anchor="middle" fill="#3fb950" font-size="10">rd</text>
  <rect x="415" y="157" width="110" height="24" rx="3" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="470" y="173" text-anchor="middle" fill="#58a6ff" font-size="10">opcode</text>

  <!-- ── S-Type ── -->
  <text x="20" y="204" fill="#f0883e" font-size="11" font-weight="bold">S-Type</text>
  <text x="20" y="216" fill="#8b949e" font-size="8">SW, SB, SH</text>
  <rect x="40"  y="221" width="100" height="24" rx="3" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="90"  y="237" text-anchor="middle" fill="#bc8cff" font-size="10">imm[11:5]</text>
  <rect x="140" y="221" width="55"  height="24" rx="3" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="167" y="237" text-anchor="middle" fill="#bc8cff" font-size="10">rs2</text>
  <rect x="195" y="221" width="55"  height="24" rx="3" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="222" y="237" text-anchor="middle" fill="#bc8cff" font-size="10">rs1</text>
  <rect x="250" y="221" width="55"  height="24" rx="3" fill="#1c2128" stroke="#f0883e" stroke-width="1.5"/>
  <text x="277" y="237" text-anchor="middle" fill="#f0883e" font-size="10">funct3</text>
  <rect x="305" y="221" width="110" height="24" rx="3" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="360" y="237" text-anchor="middle" fill="#bc8cff" font-size="10">imm[4:0]</text>
  <rect x="415" y="221" width="110" height="24" rx="3" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="470" y="237" text-anchor="middle" fill="#58a6ff" font-size="10">opcode</text>

  <!-- ── B-Type ── -->
  <text x="20" y="268" fill="#f85149" font-size="11" font-weight="bold">B-Type</text>
  <text x="20" y="280" fill="#8b949e" font-size="8">BEQ, BNE, BLT…</text>
  <rect x="40"  y="285" width="100" height="24" rx="3" fill="#1c2128" stroke="#f85149" stroke-width="1.5"/>
  <text x="90"  y="301" text-anchor="middle" fill="#f85149" font-size="9">imm[12|10:5]</text>
  <rect x="140" y="285" width="55"  height="24" rx="3" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="167" y="301" text-anchor="middle" fill="#bc8cff" font-size="10">rs2</text>
  <rect x="195" y="285" width="55"  height="24" rx="3" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="222" y="301" text-anchor="middle" fill="#bc8cff" font-size="10">rs1</text>
  <rect x="250" y="285" width="55"  height="24" rx="3" fill="#1c2128" stroke="#f0883e" stroke-width="1.5"/>
  <text x="277" y="301" text-anchor="middle" fill="#f0883e" font-size="10">funct3</text>
  <rect x="305" y="285" width="110" height="24" rx="3" fill="#1c2128" stroke="#f85149" stroke-width="1.5"/>
  <text x="360" y="301" text-anchor="middle" fill="#f85149" font-size="9">imm[4:1|11]</text>
  <rect x="415" y="285" width="110" height="24" rx="3" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="470" y="301" text-anchor="middle" fill="#58a6ff" font-size="10">opcode</text>

  <!-- ── U-Type ── -->
  <text x="20" y="332" fill="#bc8cff" font-size="11" font-weight="bold">U-Type</text>
  <text x="20" y="344" fill="#8b949e" font-size="8">LUI, AUIPC</text>
  <rect x="40"  y="349" width="265" height="24" rx="3" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="172" y="365" text-anchor="middle" fill="#bc8cff" font-size="10">imm[31:12]</text>
  <rect x="305" y="349" width="110" height="24" rx="3" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
  <text x="360" y="365" text-anchor="middle" fill="#3fb950" font-size="10">rd</text>
  <rect x="415" y="349" width="110" height="24" rx="3" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="470" y="365" text-anchor="middle" fill="#58a6ff" font-size="10">opcode</text>

  <!-- Legend -->
  <rect x="560" y="93" width="12" height="12" rx="2" fill="#58a6ff"/>
  <text x="578" y="104" fill="#8b949e" font-size="10">opcode (7b)</text>
  <rect x="560" y="113" width="12" height="12" rx="2" fill="#3fb950"/>
  <text x="578" y="124" fill="#8b949e" font-size="10">rd — dest register (5b)</text>
  <rect x="560" y="133" width="12" height="12" rx="2" fill="#bc8cff"/>
  <text x="578" y="144" fill="#8b949e" font-size="10">rs1/rs2 — source regs (5b)</text>
  <rect x="560" y="153" width="12" height="12" rx="2" fill="#f0883e"/>
  <text x="578" y="164" fill="#8b949e" font-size="10">funct3/7 — operation select</text>
  <rect x="560" y="173" width="12" height="12" rx="2" fill="#f85149"/>
  <text x="578" y="184" fill="#8b949e" font-size="10">immediate — constant value</text>
</svg>
