<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" style="background:#0d1117;font-family:ui-monospace,monospace;">
  <rect width="700" height="340" fill="#0d1117"/>
  <text x="350" y="30" fill="#e6edf3" font-size="16" font-weight="bold" text-anchor="middle">Mealy FSM — "101" Sequence Detector</text>
  <text x="350" y="50" fill="#8b949e" font-size="12" text-anchor="middle">Transition labels: input / output</text>

  <defs>
    <marker id="arh" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c9d1d9"/>
    </marker>
    <marker id="arh2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- States: IDLE(90), S1(250), S10(430), S101(590) -->
  <!-- IDLE -->
  <circle cx="90" cy="175" r="52" fill="#1e2936" stroke="#3fb950" stroke-width="2.5"/>
  <text x="90" y="179" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">IDLE</text>

  <!-- S1 -->
  <circle cx="270" cy="175" r="52" fill="#1e2936" stroke="#3fb950" stroke-width="2.5"/>
  <text x="270" y="179" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">S1</text>

  <!-- S10 -->
  <circle cx="450" cy="175" r="52" fill="#1e2936" stroke="#3fb950" stroke-width="2.5"/>
  <text x="450" y="179" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">S10</text>

  <!-- S101 -->
  <circle cx="620" cy="175" r="52" fill="#1a2e1a" stroke="#3fb950" stroke-width="2.5"/>
  <text x="620" y="172" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">S101</text>
  <text x="620" y="188" fill="#3fb950" font-size="10" text-anchor="middle">detected!</text>

  <!-- IDLE→S1: in=1/out=0 -->
  <line x1="143" y1="165" x2="218" y2="165" stroke="#c9d1d9" stroke-width="2" marker-end="url(#arh)"/>
  <text x="181" y="158" fill="#c9d1d9" font-size="10" text-anchor="middle">1 / 0</text>

  <!-- S1→S10: in=0/out=0 -->
  <line x1="323" y1="165" x2="398" y2="165" stroke="#c9d1d9" stroke-width="2" marker-end="url(#arh)"/>
  <text x="361" y="158" fill="#c9d1d9" font-size="10" text-anchor="middle">0 / 0</text>

  <!-- S10→S101: in=1/out=1 (detected!) -->
  <line x1="503" y1="165" x2="568" y2="165" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arh2)"/>
  <text x="536" y="155" fill="#3fb950" font-size="10" text-anchor="middle" font-weight="bold">1 / 1 ✓</text>

  <!-- IDLE self-loop: in=0/out=0 -->
  <path d="M 60 125 Q 30 80 90 80 Q 140 80 120 125" fill="none" stroke="#c9d1d9" stroke-width="1.5" marker-end="url(#arh)"/>
  <text x="75" y="72" fill="#c9d1d9" font-size="10" text-anchor="middle">0 / 0</text>

  <!-- S1 self-loop: in=1/out=0 -->
  <path d="M 240 125 Q 210 80 270 80 Q 320 80 300 125" fill="none" stroke="#c9d1d9" stroke-width="1.5" marker-end="url(#arh)"/>
  <text x="255" y="72" fill="#c9d1d9" font-size="10" text-anchor="middle">1 / 0</text>

  <!-- S10→S1: in=0/out=0 (arc below) -->
  <path d="M 430 227 Q 350 280 290 227" fill="none" stroke="#c9d1d9" stroke-width="1.5" marker-end="url(#arh)"/>
  <text x="360" y="290" fill="#c9d1d9" font-size="10" text-anchor="middle">0 / 0</text>

  <!-- S101→S10: in=0/out=0 -->
  <path d="M 600 227 Q 535 290 470 227" fill="none" stroke="#c9d1d9" stroke-width="1.5" marker-end="url(#arh)"/>
  <text x="540" y="288" fill="#c9d1d9" font-size="10" text-anchor="middle">0 / 0</text>

  <!-- S101→S1: in=1/out=0 (arc way below) -->
  <path d="M 580 222 Q 430 320 310 222" fill="none" stroke="#c9d1d9" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arh)"/>
  <text x="440" y="330" fill="#8b949e" font-size="10" text-anchor="middle">1 / 0 (overlap)</text>

  <text x="350" y="315" fill="#8b949e" font-size="10" text-anchor="middle">Mealy: output fires on S10→S101 transition (same cycle as last '1')</text>
</svg>
