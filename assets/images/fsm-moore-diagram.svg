<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" style="background:#0d1117;font-family:ui-monospace,monospace;">
  <!-- Background -->
  <rect width="700" height="380" fill="#0d1117"/>
  <!-- Title -->
  <text x="350" y="32" fill="#e6edf3" font-size="16" font-weight="bold" text-anchor="middle">Moore FSM — Traffic Light Controller</text>
  <text x="350" y="52" fill="#8b949e" font-size="12" text-anchor="middle">Output depends only on current state</text>

  <!-- State: RED (top center) -->
  <circle cx="350" cy="150" r="58" fill="#1e2936" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="350" y="143" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">RED</text>
  <text x="350" y="160" fill="#ffa657" font-size="11" text-anchor="middle">out = 2'b00</text>
  <text x="350" y="175" fill="#8b949e" font-size="10" text-anchor="middle">count ≤ 30</text>

  <!-- State: GREEN (bottom left) -->
  <circle cx="170" cy="300" r="58" fill="#1e2936" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="170" y="293" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">GREEN</text>
  <text x="170" y="310" fill="#ffa657" font-size="11" text-anchor="middle">out = 2'b01</text>
  <text x="170" y="325" fill="#8b949e" font-size="10" text-anchor="middle">count ≤ 25</text>

  <!-- State: YELLOW (bottom right) -->
  <circle cx="530" cy="300" r="58" fill="#1e2936" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="530" y="293" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">YELLOW</text>
  <text x="530" y="310" fill="#ffa657" font-size="11" text-anchor="middle">out = 2'b10</text>
  <text x="530" y="325" fill="#8b949e" font-size="10" text-anchor="middle">count ≤ 5</text>

  <!-- Arrow RED -> GREEN -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c9d1d9"/>
    </marker>
  </defs>
  <path d="M 300 195 Q 200 240 220 258" fill="none" stroke="#c9d1d9" stroke-width="2" marker-end="url(#arr)"/>
  <text x="228" y="222" fill="#3fb950" font-size="11" text-anchor="middle" font-weight="bold">count==30</text>

  <!-- Arrow GREEN -> YELLOW -->
  <path d="M 228 300 L 472 300" fill="none" stroke="#c9d1d9" stroke-width="2" marker-end="url(#arr)"/>
  <text x="350" y="291" fill="#3fb950" font-size="11" text-anchor="middle" font-weight="bold">count==25</text>

  <!-- Arrow YELLOW -> RED -->
  <path d="M 497 258 Q 480 210 408 178" fill="none" stroke="#c9d1d9" stroke-width="2" marker-end="url(#arr)"/>
  <text x="482" y="215" fill="#3fb950" font-size="11" text-anchor="middle" font-weight="bold">count==5</text>

  <!-- Reset arrow to RED -->
  <line x1="350" y1="60" x2="350" y2="88" stroke="#ff7b72" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="5,3"/>
  <text x="310" y="78" fill="#ff7b72" font-size="11" font-weight="bold">rst=1</text>

  <!-- Legend -->
  <rect x="20" y="340" width="14" height="14" fill="#1e2936" stroke="#58a6ff" stroke-width="1.5" rx="2"/>
  <text x="40" y="352" fill="#8b949e" font-size="11">State (output shown inside)</text>
  <text x="350" y="365" fill="#8b949e" font-size="10" text-anchor="middle">Transition condition on arrows | Moore: output = f(state only)</text>
</svg>
