<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" style="background:#0d1117;font-family:ui-monospace,monospace;">
  <rect width="700" height="400" fill="#0d1117"/>
  <text x="350" y="24" fill="#e6edf3" font-size="14" font-weight="bold" text-anchor="middle">Scan Flip-Flop &amp; Scan Chain — DFT Test Structure</text>

  <defs>
    <marker id="sc-arr" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0,7 3,0 6" fill="#c9d1d9"/>
    </marker>
    <marker id="sc-org" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0,7 3,0 6" fill="#ffa657"/>
    </marker>
    <marker id="sc-grn" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0,7 3,0 6" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- ── Scan Flip-Flop Detail (top left) ───────────────────────── -->
  <rect x="20" y="38" width="310" height="170" rx="6" fill="#161b22" stroke="#9e6bdb" stroke-width="1.5"/>
  <text x="175" y="58" fill="#9e6bdb" font-size="11" font-weight="bold" text-anchor="middle">Scan Flip-Flop (SFF) Internals</text>

  <!-- MUX -->
  <polygon points="90,80 90,140 130,120 130,100" fill="#1e2936" stroke="#ffa657" stroke-width="1.5"/>
  <text x="105" y="114" fill="#ffa657" font-size="9" text-anchor="middle">MUX</text>
  <!-- MUX inputs -->
  <line x1="40" y1="90" x2="90" y2="90" stroke="#3fb950" stroke-width="1.5" marker-end="url(#sc-arr)"/>
  <text x="35" y="88" fill="#3fb950" font-size="9" text-anchor="end">D</text>
  <text x="68" y="86" fill="#3fb950" font-size="8">"0"</text>
  <line x1="40" y1="130" x2="90" y2="130" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#sc-arr)"/>
  <text x="35" y="134" fill="#58a6ff" font-size="9" text-anchor="end">SI</text>
  <text x="68" y="126" fill="#58a6ff" font-size="8">"1"</text>
  <!-- SE -->
  <line x1="110" y1="148" x2="110" y2="140" stroke="#ffa657" stroke-width="1.5" marker-end="url(#sc-arr)"/>
  <text x="110" y="162" fill="#ffa657" font-size="9" text-anchor="middle">SE</text>
  <!-- MUX to FF -->
  <line x1="130" y1="110" x2="165" y2="110" stroke="#c9d1d9" stroke-width="1.5" marker-end="url(#sc-arr)"/>
  <!-- FF box -->
  <rect x="165" y="88" width="70" height="50" rx="4" fill="#1e2936" stroke="#c9d1d9" stroke-width="1.5"/>
  <text x="200" y="110" fill="#e6edf3" font-size="11" font-weight="bold" text-anchor="middle">FF</text>
  <text x="200" y="126" fill="#8b949e" font-size="8" text-anchor="middle">D   Q</text>
  <!-- FF clock -->
  <line x1="200" y1="138" x2="200" y2="150" stroke="#9e6bdb" stroke-width="1.5" marker-end="url(#sc-arr)"/>
  <text x="200" y="164" fill="#9e6bdb" font-size="8" text-anchor="middle">CLK</text>
  <!-- FF output -->
  <line x1="235" y1="110" x2="270" y2="110" stroke="#c9d1d9" stroke-width="1.5" marker-end="url(#sc-arr)"/>
  <text x="275" y="114" fill="#e6edf3" font-size="9">Q</text>

  <!-- Mode labels -->
  <text x="40" y="185" fill="#3fb950" font-size="9">SE=0: Normal mode — D captured (functional)</text>
  <text x="40" y="200" fill="#58a6ff" font-size="9">SE=1: Shift mode  — SI captured (scan test)</text>

  <!-- ── Scan Chain (bottom) ─────────────────────────────────────── -->
  <rect x="20" y="222" width="660" height="155" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="350" y="242" fill="#58a6ff" font-size="11" font-weight="bold" text-anchor="middle">Scan Chain — All FFs Connected into a Shift Register</text>

  <!-- Scan In pin -->
  <rect x="30" y="260" width="60" height="28" rx="4" fill="#1a1e2e" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="60" y="279" fill="#58a6ff" font-size="9" text-anchor="middle">SCAN_IN</text>
  <line x1="90" y1="274" x2="115" y2="274" stroke="#58a6ff" stroke-width="2" marker-end="url(#sc-arr)"/>

  <!-- SFF 1 -->
  <rect x="115" y="258" width="80" height="42" rx="4" fill="#1e2936" stroke="#9e6bdb" stroke-width="1.5"/>
  <text x="155" y="278" fill="#9e6bdb" font-size="10" font-weight="bold" text-anchor="middle">SFF₁</text>
  <text x="155" y="292" fill="#8b949e" font-size="8" text-anchor="middle">Logic FF</text>
  <!-- Q to next SI -->
  <line x1="195" y1="274" x2="230" y2="274" stroke="#ffa657" stroke-width="1.5" marker-end="url(#sc-arr)"/>
  <text x="212" y="268" fill="#ffa657" font-size="8">Q→SI</text>

  <!-- SFF 2 -->
  <rect x="230" y="258" width="80" height="42" rx="4" fill="#1e2936" stroke="#9e6bdb" stroke-width="1.5"/>
  <text x="270" y="278" fill="#9e6bdb" font-size="10" font-weight="bold" text-anchor="middle">SFF₂</text>
  <text x="270" y="292" fill="#8b949e" font-size="8" text-anchor="middle">Logic FF</text>
  <line x1="310" y1="274" x2="345" y2="274" stroke="#ffa657" stroke-width="1.5" marker-end="url(#sc-arr)"/>
  <text x="327" y="268" fill="#ffa657" font-size="8">Q→SI</text>

  <!-- SFF 3 -->
  <rect x="345" y="258" width="80" height="42" rx="4" fill="#1e2936" stroke="#9e6bdb" stroke-width="1.5"/>
  <text x="385" y="278" fill="#9e6bdb" font-size="10" font-weight="bold" text-anchor="middle">SFF₃</text>
  <text x="385" y="292" fill="#8b949e" font-size="8" text-anchor="middle">Logic FF</text>
  <line x1="425" y1="274" x2="460" y2="274" stroke="#ffa657" stroke-width="1.5" marker-end="url(#sc-arr)"/>
  <text x="442" y="268" fill="#ffa657" font-size="8">Q→SI</text>

  <!-- SFF N -->
  <rect x="460" y="258" width="80" height="42" rx="4" fill="#1e2936" stroke="#9e6bdb" stroke-width="1.5"/>
  <text x="500" y="278" fill="#9e6bdb" font-size="10" font-weight="bold" text-anchor="middle">SFFₙ</text>
  <text x="500" y="292" fill="#8b949e" font-size="8" text-anchor="middle">Logic FF</text>
  <line x1="540" y1="274" x2="575" y2="274" stroke="#58a6ff" stroke-width="2" marker-end="url(#sc-arr)"/>

  <!-- Scan Out pin -->
  <rect x="575" y="260" width="68" height="28" rx="4" fill="#1a1e2e" stroke="#3fb950" stroke-width="1.5"/>
  <text x="609" y="279" fill="#3fb950" font-size="9" text-anchor="middle">SCAN_OUT</text>

  <!-- dots between SFF3 and SFFN -->
  <!-- already implied by the chain -->

  <!-- SE signal (common to all) -->
  <line x1="350" y1="310" x2="350" y2="330" stroke="#ffa657" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="350" y="345" fill="#ffa657" font-size="9" text-anchor="middle">SE (Scan Enable) — broadcast to all SFFs</text>

  <!-- Test sequence -->
  <text x="50" y="368" fill="#e6edf3" font-size="9" font-weight="bold">Test sequence:</text>
  <text x="50" y="382" fill="#8b949e" font-size="9">① Shift-in (SE=1, N clocks): load test pattern via SCAN_IN</text>
  <text x="340" y="382" fill="#8b949e" font-size="9">② Capture (SE=0, 1 clock): apply DUT logic</text>
  <text x="560" y="382" fill="#8b949e" font-size="9">③ Shift-out (SE=1)</text>

  <!-- ── Functional logic block (top right) ─────────────────────── -->
  <rect x="345" y="38" width="335" height="170" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="512" y="58" fill="#3fb950" font-size="11" font-weight="bold" text-anchor="middle">DFT Fault Coverage</text>

  <text x="360" y="80" fill="#e6edf3" font-size="10" font-weight="bold">Fault Models:</text>
  <text x="360" y="97" fill="#8b949e" font-size="9">• Stuck-at-0 (SA0): node stuck low regardless of logic</text>
  <text x="360" y="112" fill="#8b949e" font-size="9">• Stuck-at-1 (SA1): node stuck high regardless of logic</text>
  <text x="360" y="127" fill="#8b949e" font-size="9">• Transition faults: node slow-to-rise or slow-to-fall</text>

  <text x="360" y="148" fill="#e6edf3" font-size="10" font-weight="bold">Coverage Targets:</text>
  <text x="360" y="165" fill="#3fb950" font-size="9">• Tapeout requirement: ≥ 97–99% stuck-at coverage</text>
  <text x="360" y="180" fill="#8b949e" font-size="9">• ATPG generates patterns to detect each fault</text>
  <text x="360" y="195" fill="#8b949e" font-size="9">• Compression (EDT) reduces test time 10–100×</text>
</svg>
