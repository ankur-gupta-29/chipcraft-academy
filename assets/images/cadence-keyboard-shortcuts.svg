<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">

  <!-- Background -->
  <rect width="800" height="420" rx="14" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle"
        font-family="'Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="18" font-weight="700" fill="#e6edf3">
    Cadence Virtuoso &amp; Innovus — Keyboard Shortcuts
  </text>
  <text x="400" y="56" text-anchor="middle"
        font-family="'Segoe UI',system-ui,sans-serif"
        font-size="12" fill="#8b949e">
    Schematic / Layout Editor (Virtuoso) · Place &amp; Route (Innovus)
  </text>

  <!-- Keyboard bezel outer -->
  <rect x="16" y="68" width="768" height="236" rx="14"
        fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <!-- Keyboard bezel inner surface -->
  <rect x="22" y="74" width="756" height="224" rx="10" fill="#161b22"/>

  <!-- ═══════════════════════════════════════════════════════
       ROW 1  — Q W E R T Y U I O P  (y = 84)
       ═══════════════════════════════════════════════════════ -->

  <!-- Tab -->
  <rect x="28" y="84" width="64" height="48" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="60"  y="113" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" fill="#6e7681">Tab</text>

  <!-- Q — BOTH — Properties -->
  <rect x="96"  y="84" width="44" height="48" rx="6" fill="#1f1208" stroke="#f78166" stroke-width="2"/>
  <text x="118" y="100" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#f78166">Q</text>
  <text x="118" y="122" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="9"  font-weight="600" fill="#f78166">Props</text>

  <!-- W — VIRT — Add Wire -->
  <rect x="144" y="84" width="44" height="48" rx="6" fill="#091526" stroke="#58a6ff" stroke-width="2"/>
  <text x="166" y="100" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#58a6ff">W</text>
  <text x="166" y="122" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="9"  font-weight="600" fill="#58a6ff">Wire</text>

  <!-- E — VIRT — Enter Hierarchy -->
  <rect x="192" y="84" width="44" height="48" rx="6" fill="#091526" stroke="#58a6ff" stroke-width="2"/>
  <text x="214" y="100" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#58a6ff">E</text>
  <text x="214" y="122" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="9"  font-weight="600" fill="#58a6ff">Hier</text>

  <!-- R — VIRT — Rectangle (Layout) -->
  <rect x="240" y="84" width="44" height="48" rx="6" fill="#091526" stroke="#58a6ff" stroke-width="2"/>
  <text x="262" y="100" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#58a6ff">R</text>
  <text x="262" y="122" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="9"  font-weight="600" fill="#58a6ff">Rect</text>

  <!-- T — none -->
  <rect x="288" y="84" width="44" height="48" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <text x="310" y="113" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#6e7681">T</text>

  <!-- Y — none -->
  <rect x="336" y="84" width="44" height="48" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <text x="358" y="113" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#6e7681">Y</text>

  <!-- U — VIRT — Undo -->
  <rect x="384" y="84" width="44" height="48" rx="6" fill="#091526" stroke="#58a6ff" stroke-width="2"/>
  <text x="406" y="100" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#58a6ff">U</text>
  <text x="406" y="122" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="9"  font-weight="600" fill="#58a6ff">Undo</text>

  <!-- I — VIRT — Place Instance -->
  <rect x="432" y="84" width="44" height="48" rx="6" fill="#091526" stroke="#58a6ff" stroke-width="2"/>
  <text x="454" y="100" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#58a6ff">I</text>
  <text x="454" y="122" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="9"  font-weight="600" fill="#58a6ff">Inst.</text>

  <!-- O — none -->
  <rect x="480" y="84" width="44" height="48" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <text x="502" y="113" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#6e7681">O</text>

  <!-- P — VIRT — Add Pin -->
  <rect x="528" y="84" width="44" height="48" rx="6" fill="#091526" stroke="#58a6ff" stroke-width="2"/>
  <text x="550" y="100" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#58a6ff">P</text>
  <text x="550" y="122" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="9"  font-weight="600" fill="#58a6ff">Pin</text>

  <!-- [ — none -->
  <rect x="576" y="84" width="44" height="48" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <text x="598" y="113" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#6e7681">[</text>

  <!-- ] — none -->
  <rect x="624" y="84" width="44" height="48" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <text x="646" y="113" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#6e7681">]</text>

  <!-- Backslash — wide key -->
  <rect x="672" y="84" width="100" height="48" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="722" y="113" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#6e7681">\</text>

  <!-- ═══════════════════════════════════════════════════════
       ROW 2  — A S D F G H J K L  (y = 136)
       ═══════════════════════════════════════════════════════ -->

  <!-- Caps Lock -->
  <rect x="28"  y="136" width="74"  height="48" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="65"  y="165" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="600" fill="#6e7681">Caps</text>

  <!-- A — none -->
  <rect x="106" y="136" width="44" height="48" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <text x="128" y="165" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#6e7681">A</text>

  <!-- S — INNO — Select -->
  <rect x="154" y="136" width="44" height="48" rx="6" fill="#091b0d" stroke="#3fb950" stroke-width="2"/>
  <text x="176" y="152" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#3fb950">S</text>
  <text x="176" y="174" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="9"  font-weight="600" fill="#3fb950">Select</text>

  <!-- D — BOTH — Delete -->
  <rect x="202" y="136" width="44" height="48" rx="6" fill="#1f1208" stroke="#f78166" stroke-width="2"/>
  <text x="224" y="152" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#f78166">D</text>
  <text x="224" y="174" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="9"  font-weight="600" fill="#f78166">Delete</text>

  <!-- F — BOTH — Fit View -->
  <rect x="250" y="136" width="44" height="48" rx="6" fill="#1f1208" stroke="#f78166" stroke-width="2"/>
  <text x="272" y="152" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#f78166">F</text>
  <text x="272" y="174" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="9"  font-weight="600" fill="#f78166">Fit</text>

  <!-- G — INNO — Go To / Fly To Net -->
  <rect x="298" y="136" width="44" height="48" rx="6" fill="#091b0d" stroke="#3fb950" stroke-width="2"/>
  <text x="320" y="152" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#3fb950">G</text>
  <text x="320" y="174" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="9"  font-weight="600" fill="#3fb950">Go To</text>

  <!-- H — INNO — Highlight -->
  <rect x="346" y="136" width="44" height="48" rx="6" fill="#091b0d" stroke="#3fb950" stroke-width="2"/>
  <text x="368" y="152" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#3fb950">H</text>
  <text x="368" y="174" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="9"  font-weight="600" fill="#3fb950">Hilite</text>

  <!-- J — none -->
  <rect x="394" y="136" width="44" height="48" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <text x="416" y="165" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#6e7681">J</text>

  <!-- K — VIRT — Ruler / Measure -->
  <rect x="442" y="136" width="44" height="48" rx="6" fill="#091526" stroke="#58a6ff" stroke-width="2"/>
  <text x="464" y="152" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#58a6ff">K</text>
  <text x="464" y="174" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="9"  font-weight="600" fill="#58a6ff">Ruler</text>

  <!-- L — VIRT — Add Label -->
  <rect x="490" y="136" width="44" height="48" rx="6" fill="#091526" stroke="#58a6ff" stroke-width="2"/>
  <text x="512" y="152" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#58a6ff">L</text>
  <text x="512" y="174" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="9"  font-weight="600" fill="#58a6ff">Label</text>

  <!-- ; — none -->
  <rect x="538" y="136" width="44" height="48" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <text x="560" y="165" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#6e7681">;</text>

  <!-- ' — none -->
  <rect x="586" y="136" width="44" height="48" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <text x="608" y="165" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#6e7681">'</text>

  <!-- Enter — wide -->
  <rect x="634" y="136" width="138" height="48" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="703" y="165" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#6e7681">↵ Enter</text>

  <!-- ═══════════════════════════════════════════════════════
       ROW 3  — Z X C V B N M  (y = 188)
       ═══════════════════════════════════════════════════════ -->

  <!-- LShift -->
  <rect x="28"  y="188" width="96"  height="48" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="76"  y="217" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" fill="#6e7681">⇧ Shift</text>

  <!-- Z — BOTH — Zoom In  /  Shift+Z = Zoom Out -->
  <rect x="128" y="188" width="44" height="48" rx="6" fill="#1f1208" stroke="#f78166" stroke-width="2"/>
  <text x="150" y="202" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#f78166">Z</text>
  <text x="150" y="216" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="600" fill="#f78166">Zoom +</text>
  <text x="150" y="229" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="7.5" fill="#9e5444">⇧ Zoom −</text>

  <!-- X — VIRT — Stretch -->
  <rect x="176" y="188" width="44" height="48" rx="6" fill="#091526" stroke="#58a6ff" stroke-width="2"/>
  <text x="198" y="204" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#58a6ff">X</text>
  <text x="198" y="226" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="9"  font-weight="600" fill="#58a6ff">Stretch</text>

  <!-- C — BOTH — Copy -->
  <rect x="224" y="188" width="44" height="48" rx="6" fill="#1f1208" stroke="#f78166" stroke-width="2"/>
  <text x="246" y="204" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#f78166">C</text>
  <text x="246" y="226" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="9"  font-weight="600" fill="#f78166">Copy</text>

  <!-- V — none -->
  <rect x="272" y="188" width="44" height="48" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <text x="294" y="217" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#6e7681">V</text>

  <!-- B — none -->
  <rect x="320" y="188" width="44" height="48" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <text x="342" y="217" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#6e7681">B</text>

  <!-- N — none -->
  <rect x="368" y="188" width="44" height="48" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <text x="390" y="217" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#6e7681">N</text>

  <!-- M — BOTH — Move -->
  <rect x="416" y="188" width="44" height="48" rx="6" fill="#1f1208" stroke="#f78166" stroke-width="2"/>
  <text x="438" y="204" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#f78166">M</text>
  <text x="438" y="226" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="9"  font-weight="600" fill="#f78166">Move</text>

  <!-- , . / — none -->
  <rect x="464" y="188" width="44" height="48" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <text x="486" y="217" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#6e7681">,</text>

  <rect x="512" y="188" width="44" height="48" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <text x="534" y="217" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#6e7681">.</text>

  <rect x="560" y="188" width="44" height="48" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <text x="582" y="217" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#6e7681">/</text>

  <!-- RShift -->
  <rect x="608" y="188" width="164" height="48" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="690" y="217" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" fill="#6e7681">⇧ Shift</text>

  <!-- ═══════════════════════════════════════════════════════
       ROW 4  — Space bar row  (y = 240)
       ═══════════════════════════════════════════════════════ -->

  <!-- LCtrl -->
  <rect x="28"  y="240" width="72" height="48" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="64"  y="257" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" fill="#6e7681">Ctrl</text>
  <text x="64"  y="274" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="7.5" fill="#484f58">+Z +S +Y</text>

  <!-- LAlt -->
  <rect x="104" y="240" width="52" height="48" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="130" y="269" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" fill="#6e7681">Alt</text>

  <!-- Space bar -->
  <rect x="160" y="240" width="480" height="48" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <text x="400" y="269" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#6e7681">Space</text>

  <!-- RAlt -->
  <rect x="644" y="240" width="52" height="48" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="670" y="269" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" fill="#6e7681">Alt</text>

  <!-- RCtrl -->
  <rect x="700" y="240" width="72" height="48" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="736" y="257" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" fill="#6e7681">Ctrl</text>
  <text x="736" y="274" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="7.5" fill="#484f58">+A +F</text>

  <!-- ═══════════════════════════════════════════════════════
       LEGEND  (y = 318)
       ═══════════════════════════════════════════════════════ -->

  <!-- Left column: colour key -->
  <rect x="28"  y="318" width="22" height="16" rx="4" fill="#091526" stroke="#58a6ff" stroke-width="2"/>
  <text x="58"  y="331" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="#58a6ff">Virtuoso</text>
  <text x="138" y="331" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#8b949e">Schematic &amp; Layout Editor</text>

  <rect x="28"  y="344" width="22" height="16" rx="4" fill="#091b0d" stroke="#3fb950" stroke-width="2"/>
  <text x="58"  y="357" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="#3fb950">Innovus</text>
  <text x="128" y="357" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#8b949e">Place &amp; Route</text>

  <rect x="28"  y="370" width="22" height="16" rx="4" fill="#1f1208" stroke="#f78166" stroke-width="2"/>
  <text x="58"  y="383" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="#f78166">Both</text>
  <text x="96"  y="383" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#8b949e">Common to both tools</text>

  <!-- Right column: Ctrl combos -->
  <line x1="420" y1="312" x2="420" y2="408" stroke="#30363d" stroke-width="1"/>

  <text x="436" y="316" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" fill="#8b949e" letter-spacing="0.5">CTRL COMBOS</text>

  <text x="436" y="336" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#6e7681">
    <tspan font-weight="700" fill="#e6edf3">Ctrl+Z</tspan>  Undo
  </text>
  <text x="436" y="354" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#6e7681">
    <tspan font-weight="700" fill="#e6edf3">Ctrl+Y</tspan>  Redo
  </text>
  <text x="436" y="372" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#6e7681">
    <tspan font-weight="700" fill="#e6edf3">Ctrl+S</tspan>  Save
  </text>
  <text x="436" y="390" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#6e7681">
    <tspan font-weight="700" fill="#e6edf3">Esc</tspan>      Cancel / Deselect
  </text>
  <text x="436" y="408" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#6e7681">
    <tspan font-weight="700" fill="#e6edf3">Del</tspan>      Delete selected object
  </text>

</svg>
