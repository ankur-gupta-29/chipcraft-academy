<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" style="background:#0d1117;font-family:ui-monospace,monospace;">
  <rect width="700" height="380" fill="#0d1117"/>
  <text x="350" y="28" fill="#e6edf3" font-size="15" font-weight="bold" text-anchor="middle">AXI4 — 5 Independent Channels</text>

  <!-- Master box -->
  <rect x="30" y="60" width="150" height="280" rx="8" fill="#1e2936" stroke="#58a6ff" stroke-width="2"/>
  <text x="105" y="90" fill="#58a6ff" font-size="13" font-weight="bold" text-anchor="middle">AXI Master</text>
  <text x="105" y="108" fill="#8b949e" font-size="10" text-anchor="middle">(CPU, DMA)</text>

  <!-- Slave box -->
  <rect x="520" y="60" width="150" height="280" rx="8" fill="#1e2936" stroke="#3fb950" stroke-width="2"/>
  <text x="595" y="90" fill="#3fb950" font-size="13" font-weight="bold" text-anchor="middle">AXI Slave</text>
  <text x="595" y="108" fill="#8b949e" font-size="10" text-anchor="middle">(SRAM, Periph)</text>

  <defs>
    <marker id="arr-r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ffa657"/>
    </marker>
    <marker id="arr-l" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#3fb950"/>
    </marker>
    <marker id="arr-r2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9e6bdb"/>
    </marker>
  </defs>

  <!-- Channel 1: Write Address AW -->
  <rect x="190" y="90" width="320" height="36" rx="4" fill="#1a1f0f" stroke="#ffa657" stroke-width="1.5"/>
  <text x="350" y="104" fill="#ffa657" font-size="11" font-weight="bold" text-anchor="middle">AW — Write Address Channel</text>
  <text x="350" y="119" fill="#8b949e" font-size="9" text-anchor="middle">AWADDR · AWLEN · AWSIZE · AWBURST · AWVALID · AWREADY</text>
  <line x1="180" y1="108" x2="192" y2="108" stroke="#ffa657" stroke-width="2" marker-end="url(#arr-r)"/>

  <!-- Channel 2: Write Data W -->
  <rect x="190" y="148" width="320" height="36" rx="4" fill="#1a1f0f" stroke="#ffa657" stroke-width="1.5"/>
  <text x="350" y="162" fill="#ffa657" font-size="11" font-weight="bold" text-anchor="middle">W — Write Data Channel</text>
  <text x="350" y="177" fill="#8b949e" font-size="9" text-anchor="middle">WDATA · WSTRB · WLAST · WVALID · WREADY</text>
  <line x1="180" y1="166" x2="192" y2="166" stroke="#ffa657" stroke-width="2" marker-end="url(#arr-r)"/>

  <!-- Channel 3: Write Response B -->
  <rect x="190" y="206" width="320" height="36" rx="4" fill="#0f1a0f" stroke="#3fb950" stroke-width="1.5"/>
  <text x="350" y="220" fill="#3fb950" font-size="11" font-weight="bold" text-anchor="middle">B — Write Response Channel</text>
  <text x="350" y="235" fill="#8b949e" font-size="9" text-anchor="middle">BRESP · BVALID · BREADY</text>
  <line x1="510" y1="224" x2="522" y2="224" stroke="#3fb950" stroke-width="2" marker-end="url(#arr-l)" transform="rotate(180,516,224)"/>

  <!-- Channel 4: Read Address AR -->
  <rect x="190" y="264" width="320" height="36" rx="4" fill="#1a1f0f" stroke="#9e6bdb" stroke-width="1.5"/>
  <text x="350" y="278" fill="#9e6bdb" font-size="11" font-weight="bold" text-anchor="middle">AR — Read Address Channel</text>
  <text x="350" y="293" fill="#8b949e" font-size="9" text-anchor="middle">ARADDR · ARLEN · ARSIZE · ARVALID · ARREADY</text>
  <line x1="180" y1="282" x2="192" y2="282" stroke="#9e6bdb" stroke-width="2" marker-end="url(#arr-r2)"/>

  <!-- Channel 5: Read Data R -->
  <rect x="190" y="322" width="320" height="36" rx="4" fill="#0f0f1a" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="350" y="336" fill="#58a6ff" font-size="11" font-weight="bold" text-anchor="middle">R — Read Data Channel</text>
  <text x="350" y="351" fill="#8b949e" font-size="9" text-anchor="middle">RDATA · RRESP · RLAST · RVALID · RREADY</text>
  <line x1="512" y1="340" x2="520" y2="340" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="190,337 198,340 190,343" fill="#58a6ff"/>
  <line x1="190" y1="340" x2="512" y2="340" stroke="#58a6ff" stroke-width="2"/>

  <!-- Arrow directions label -->
  <text x="350" y="372" fill="#8b949e" font-size="9" text-anchor="middle">Orange → Master to Slave &nbsp;|&nbsp; Green/Blue ← Slave to Master</text>
</svg>
