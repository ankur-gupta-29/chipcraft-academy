<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" style="background:#0d1117;font-family:ui-monospace,monospace;">
  <rect width="700" height="320" fill="#0d1117"/>
  <text x="350" y="28" fill="#e6edf3" font-size="15" font-weight="bold" text-anchor="middle">Two-Flop Synchronizer — CDC Solution</text>

  <defs>
    <marker id="cdarr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c9d1d9"/>
    </marker>
    <marker id="garr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- Domain labels -->
  <rect x="20" y="45" width="270" height="230" rx="8" fill="#0d1529" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="155" y="65" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">Source Domain (clk_a)</text>

  <rect x="310" y="45" width="370" height="230" rx="8" fill="#0d1a0d" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="495" y="65" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">Destination Domain (clk_b)</text>

  <!-- Source FF -->
  <rect x="70" y="110" width="90" height="100" rx="6" fill="#1e2936" stroke="#58a6ff" stroke-width="2"/>
  <text x="115" y="148" fill="#58a6ff" font-size="11" font-weight="bold" text-anchor="middle">FF_src</text>
  <text x="115" y="163" fill="#8b949e" font-size="9" text-anchor="middle">D   Q</text>
  <text x="115" y="195" fill="#58a6ff" font-size="9" text-anchor="middle">▶ clk_a</text>
  <!-- D input -->
  <line x1="30" y1="148" x2="70" y2="148" stroke="#c9d1d9" stroke-width="2" marker-end="url(#cdarr)"/>
  <text x="25" y="143" fill="#c9d1d9" font-size="10" text-anchor="end">data_in</text>

  <!-- FF1 in dest domain -->
  <rect x="350" y="110" width="90" height="100" rx="6" fill="#1e2936" stroke="#3fb950" stroke-width="2"/>
  <text x="395" y="148" fill="#3fb950" font-size="11" font-weight="bold" text-anchor="middle">FF1</text>
  <text x="395" y="163" fill="#8b949e" font-size="9" text-anchor="middle">D   Q</text>
  <text x="395" y="195" fill="#3fb950" font-size="9" text-anchor="middle">▶ clk_b</text>

  <!-- FF2 in dest domain -->
  <rect x="500" y="110" width="90" height="100" rx="6" fill="#1e2936" stroke="#3fb950" stroke-width="2"/>
  <text x="545" y="148" fill="#3fb950" font-size="11" font-weight="bold" text-anchor="middle">FF2</text>
  <text x="545" y="163" fill="#8b949e" font-size="9" text-anchor="middle">D   Q</text>
  <text x="545" y="195" fill="#3fb950" font-size="9" text-anchor="middle">▶ clk_b</text>

  <!-- Arrow src→FF1 (crossing boundary) -->
  <line x1="160" y1="148" x2="350" y2="148" stroke="#c9d1d9" stroke-width="2" marker-end="url(#cdarr)"/>
  <text x="255" y="135" fill="#ff7b72" font-size="10" text-anchor="middle">⚠ May go metastable</text>
  <text x="255" y="148" fill="#8b949e" font-size="9" text-anchor="middle">— boundary crossing —</text>

  <!-- Arrow FF1→FF2 -->
  <line x1="440" y1="148" x2="500" y2="148" stroke="#c9d1d9" stroke-width="2" marker-end="url(#garr)"/>
  <text x="470" y="140" fill="#3fb950" font-size="9" text-anchor="middle">Resolved ✓</text>

  <!-- Output -->
  <line x1="590" y1="148" x2="650" y2="148" stroke="#3fb950" stroke-width="2" marker-end="url(#garr)"/>
  <text x="666" y="143" fill="#3fb950" font-size="10">data_sync</text>

  <!-- Domain boundary line -->
  <line x1="295" y1="40" x2="295" y2="290" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="295" y="295" fill="#8b949e" font-size="9" text-anchor="middle">Clock Domain Boundary</text>

  <!-- Explanation boxes -->
  <rect x="315" y="230" width="170" height="36" rx="4" fill="#1a1a2e" stroke="#ff7b72" stroke-width="1"/>
  <text x="400" y="245" fill="#ff7b72" font-size="9" text-anchor="middle">FF1 output may be metastable</text>
  <text x="400" y="258" fill="#8b949e" font-size="9" text-anchor="middle">but resolves within 1 clk_b cycle</text>

  <rect x="495" y="230" width="170" height="36" rx="4" fill="#0d1a0d" stroke="#3fb950" stroke-width="1"/>
  <text x="580" y="245" fill="#3fb950" font-size="9" text-anchor="middle">FF2 output is stable ✓</text>
  <text x="580" y="258" fill="#8b949e" font-size="9" text-anchor="middle">safe to use in clk_b domain</text>

  <text x="350" y="306" fill="#8b949e" font-size="10" text-anchor="middle">Valid only for SINGLE-BIT control signals — not multi-bit buses</text>
</svg>
