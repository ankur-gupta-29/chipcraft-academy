<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 220" style="background:#161b22;border-radius:12px;font-family:monospace;">
  <!-- Title -->
  <text x="390" y="28" text-anchor="middle" fill="#8b949e" font-size="13">TIMING PATH: Launch Flop → Combinational Logic → Capture Flop</text>

  <!-- Clock source -->
  <rect x="20" y="80" width="80" height="50" rx="6" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="60" y="101" text-anchor="middle" fill="#58a6ff" font-size="11">CLK</text>
  <text x="60" y="117" text-anchor="middle" fill="#8b949e" font-size="10">Source</text>

  <!-- Arrow from CLK to Launch FF -->
  <line x1="100" y1="105" x2="155" y2="105" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="127" y="98" text-anchor="middle" fill="#8b949e" font-size="9">clk</text>

  <!-- Launch FF -->
  <rect x="155" y="60" width="110" height="90" rx="6" fill="#1c2128" stroke="#3fb950" stroke-width="2"/>
  <text x="210" y="95" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">Launch</text>
  <text x="210" y="111" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">Flop</text>
  <text x="210" y="130" text-anchor="middle" fill="#8b949e" font-size="9">(FF1)</text>

  <!-- Arrow Launch FF to Combo -->
  <line x1="265" y1="105" x2="340" y2="105" stroke="#f0883e" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="302" y="95" text-anchor="middle" fill="#f0883e" font-size="10">Q</text>

  <!-- Combinational Logic block -->
  <rect x="340" y="55" width="140" height="100" rx="6" fill="#1c2128" stroke="#f0883e" stroke-width="2"/>
  <text x="410" y="88" text-anchor="middle" fill="#f0883e" font-size="11">Combinational</text>
  <text x="410" y="104" text-anchor="middle" fill="#f0883e" font-size="11">Logic</text>
  <text x="410" y="122" text-anchor="middle" fill="#8b949e" font-size="9">AND + OR + MUX</text>
  <text x="410" y="140" text-anchor="middle" fill="#8b949e" font-size="9">Δt = comb delay</text>

  <!-- Arrow Combo to Capture FF -->
  <line x1="480" y1="105" x2="545" y2="105" stroke="#bc8cff" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="512" y="95" text-anchor="middle" fill="#bc8cff" font-size="10">D</text>

  <!-- Capture FF -->
  <rect x="545" y="60" width="110" height="90" rx="6" fill="#1c2128" stroke="#bc8cff" stroke-width="2"/>
  <text x="600" y="95" text-anchor="middle" fill="#bc8cff" font-size="12" font-weight="bold">Capture</text>
  <text x="600" y="111" text-anchor="middle" fill="#bc8cff" font-size="12" font-weight="bold">Flop</text>
  <text x="600" y="130" text-anchor="middle" fill="#8b949e" font-size="9">(FF2)</text>

  <!-- CLK to Capture FF -->
  <line x1="100" y1="160" x2="545" y2="160" stroke="#58a6ff" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="545" y1="160" x2="545" y2="130" stroke="#58a6ff" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>

  <!-- Labels below -->
  <text x="210" y="190" text-anchor="middle" fill="#3fb950" font-size="10">T_clk-to-Q</text>
  <text x="410" y="190" text-anchor="middle" fill="#f0883e" font-size="10">T_comb (data path)</text>
  <text x="600" y="190" text-anchor="middle" fill="#bc8cff" font-size="10">T_setup required</text>

  <!-- Slack label -->
  <rect x="660" y="75" width="100" height="55" rx="6" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
  <text x="710" y="97" text-anchor="middle" fill="#8b949e" font-size="10">Slack =</text>
  <text x="710" y="113" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">Required -</text>
  <text x="710" y="127" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">Arrival</text>

  <!-- Arrow defs -->
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f0883e"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#bc8cff"/>
    </marker>
  </defs>
</svg>
